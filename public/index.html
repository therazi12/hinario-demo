<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hinário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="flame.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hinário A Luz do Mundo</title>
<style>
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/eb-garamond-latin-600-normal.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  --bg:#ffffff; --bg2:#ffffff; --card:#fbf8f1; --card2:#f5eedd; --line:#eee4cc; --paper:#fffdf8;
  --text:#2b2417; --muted:#8c8068; --gold:#b5832a; --gold2:#ddb253; --goldbg:rgba(181,131,42,.10); --ongold:#2a1c04;
  --shadow:rgba(120,90,30,.14);
  --radius:16px; --ease:cubic-bezier(.22,.9,.3,1); --fs:18.5px;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
}
html[data-theme="dark"]{
  --bg:#121726; --bg2:#1a2032; --card:#1e2538; --card2:#252d43; --line:#2c3550; --paper:#151a2a;
  --text:#eef0f6; --muted:#8a93ab; --gold:#e8b44a; --gold2:#f5d27e; --goldbg:rgba(232,180,74,.14); --ongold:#1b1406;
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;transition:background .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.flame{display:block}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .6s var(--ease),visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .flame{width:86px;height:86px;filter:drop-shadow(0 10px 24px rgba(201,149,47,.35));
  animation:pop .8s var(--ease) backwards,flick 3.2s ease-in-out .8s infinite;transform-origin:50% 90%}
.splash-t{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.5px;animation:up .7s .2s var(--ease) backwards}
.splash-s0{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:17px;margin-top:-10px;animation:up .7s .28s var(--ease) backwards}
.splash-s{color:var(--muted);font-size:14px;animation:up .7s .35s var(--ease) backwards}
.bar{width:220px;height:5px;border-radius:9px;background:var(--card2);overflow:hidden;animation:up .7s .45s var(--ease) backwards}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .12s linear}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.03,.98) rotate(-1.5deg)}60%{transform:scale(.98,1.03) rotate(1.2deg)}}
@keyframes up{from{transform:translateY(14px);opacity:0}}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;
  transition:padding .35s var(--ease),box-shadow .35s}
header.small{padding-top:calc(env(safe-area-inset-top) + 8px);box-shadow:0 8px 24px var(--shadow)}
.top{display:flex;align-items:center;gap:10px}
.top .flame{width:30px;height:30px;flex:none;transition:width .35s var(--ease),height .35s var(--ease)}
header.small .top .flame{width:24px;height:24px}
.top h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:600;flex:1;line-height:1.05;transition:font-size .35s var(--ease)}
.top h1 small{display:block;font-size:13px;font-style:italic;font-weight:400;color:var(--gold);letter-spacing:.3px}
header.small .top h1{font-size:23px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;transition:background .25s,transform .2s}
.icon-btn:hover{background:var(--card)}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:22px;height:22px}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;height:48px;transition:border-color .25s,box-shadow .25s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldbg)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--muted)}
#clear{opacity:0;pointer-events:none;transition:opacity .2s}
#clear.on{opacity:1;pointer-events:auto}
.tabs{position:relative;display:flex;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;position:relative;z-index:1;height:36px;font-size:14px;font-weight:600;color:var(--muted);transition:color .3s}
.tabs button.on{color:var(--ongold)}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),var(--gold));
  transition:transform .45s var(--ease),width .45s var(--ease);box-shadow:0 4px 14px rgba(201,149,47,.35)}

/* ---------- Lista ---------- */
main{padding:6px 44px 120px 18px}
.sec{display:flex;align-items:center;gap:12px;margin:20px 0 10px}
.sec b{min-width:32px;height:32px;padding:0 6px;border-radius:9px;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:18px}
html[data-theme="dark"] .sec b{color:var(--ongold)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 10px 12px 12px;margin-bottom:10px;position:relative;overflow:hidden;
  transition:transform .3s var(--ease),background .3s,box-shadow .3s}
.item.rv{opacity:0;transform:translateY(16px)}
.item.in{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .5s var(--ease),background .3s,box-shadow .3s}
.item:hover{background:var(--card2);box-shadow:0 8px 22px var(--shadow)}
.item:active{transform:scale(.98)}
.num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--goldbg);color:var(--gold);display:grid;place-items:center;
  font-family:var(--serif);font-weight:600;font-size:19px}
.num.ad{font-size:15px}
.meta{flex:1;min-width:0}
.meta .t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta mark{background:var(--goldbg);color:var(--gold);border-radius:4px;padding:0 2px}
.star{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:color .25s,transform .25s;flex:none}
.star svg{width:20px;height:20px}
.star.on{color:var(--gold)}
.star.on svg{fill:currentColor}
.star.burst{animation:burst .45s var(--ease)}
@keyframes burst{40%{transform:scale(1.45) rotate(-12deg)}}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.ripple{position:absolute;border-radius:50%;background:var(--gold);opacity:.18;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.empty{text-align:center;color:var(--muted);padding:60px 20px;animation:up .5s var(--ease) backwards}
.empty .flame{width:48px;height:48px;margin:0 auto;opacity:.75}

#rail{position:fixed;right:max(4px,calc(50% - 276px));top:50%;transform:translateY(-42%);z-index:9;display:flex;flex-direction:column;
  align-items:center;padding:8px 4px;border-radius:20px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);touch-action:none;transition:opacity .3s}
#rail span{font-size:10.5px;font-weight:700;color:var(--muted);line-height:17px;width:22px;text-align:center;transition:color .15s,transform .15s}
#rail span.hot{color:var(--gold);transform:scale(1.5)}
#bubble{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.6);width:84px;height:84px;border-radius:24px;
  background:var(--gold);color:#fff;font-family:var(--serif);font-size:44px;font-weight:600;display:grid;place-items:center;z-index:20;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .25s var(--ease);box-shadow:0 14px 40px var(--shadow)}
#bubble.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#install{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(528px,calc(100% - 28px));
  z-index:15;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  box-shadow:0 18px 50px var(--shadow);transition:transform .6s var(--ease)}
#install.on{transform:translate(-50%,0)}
#install .mini{width:44px;height:44px;border-radius:12px;flex:none;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
#install .mini .flame{width:28px;height:28px}
#install p{margin:0;flex:1;font-size:13.5px;line-height:1.35}
#install p b{display:block;font-size:15px}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ongold);font-weight:700;border-radius:11px;padding:10px 14px;font-size:14px;
  transition:transform .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(201,149,47,.35)}
.btn:active{transform:scale(.95)}

/* ---------- Vista del himno (página de libro) ---------- */
#view{position:fixed;inset:0;z-index:30;background:var(--bg);transform:translateX(100%);transition:transform .45s var(--ease);
  display:flex;flex-direction:column;visibility:hidden}
#view.on{transform:none;visibility:visible}
.vbar{position:relative;z-index:3;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;max-width:600px;width:100%;margin:0 auto}
.vbar .vt{flex:1;font-family:var(--serif);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;opacity:0;transition:opacity .3s}
.vbar .vt.on{opacity:1}
#progress{position:relative;z-index:3;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .1s}
#vscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:1;background:var(--bg)}
.page{max-width:600px;margin:6px auto 0;min-height:calc(100% - 6px);padding:30px 18px 150px;background:var(--paper);
  font-family:var(--serif);text-align:center;position:relative;
  box-shadow:inset 0 0 0 1px var(--line), 0 0 30px var(--shadow)}
.page::before{content:"";position:absolute;inset:10px 10px auto 10px;bottom:auto;height:calc(100% - 20px);border:1px solid var(--goldbg);border-radius:4px;pointer-events:none}
.page.anim>*{animation:up .55s var(--ease) backwards}
.page .hk{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--muted)}
.page .hnum{font-size:58px;line-height:1;color:var(--gold);font-weight:600;margin:4px 0 6px}
.page .hnum.ad{font-size:40px}
.page h2{font-size:23px;line-height:1.25;margin:0 auto;max-width:440px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.page .ref{font-style:italic;color:var(--muted);font-size:15px;margin-top:8px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:18px auto 22px;max-width:260px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
.orn .flame{width:16px;height:16px}
.st{margin:0 auto 26px;max-width:470px}
.st .sn{display:block;color:var(--gold);font-weight:600;font-size:17px;margin-bottom:4px}
.st p{margin:0;font-size:var(--fs);line-height:1.6;transition:font-size .3s var(--ease)}
.st.coro{background:var(--goldbg);border-radius:12px;padding:12px 14px 14px;position:relative}
.st.coro .sn{font-size:13px;letter-spacing:3px;text-transform:uppercase}
.st.coro p{font-style:italic}
.page .foot{margin-top:30px;color:var(--muted);font-size:15px;letter-spacing:2px}

/* hoja que pasa */
.flip{position:absolute;z-index:2;overflow:hidden;background:var(--bg);pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.flip .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.flip .page{margin-top:6px}
.under-shade{position:absolute;z-index:1;pointer-events:none;opacity:0}

.navb{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;
  background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 14px 40px var(--shadow)}
.navb .icon-btn{width:46px;height:46px}
.navb .fs{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.navb .fs button{width:40px;height:40px;border-radius:10px;font-family:var(--serif);font-weight:600;font-size:17px}
.navb .fs button:hover{background:var(--card)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 18px);transform:translate(-50%,calc(-100% - 40px));opacity:0;background:var(--gold);color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:transform .45s var(--ease),opacity .3s;box-shadow:0 10px 30px var(--shadow)}
.toast.on{transform:translate(-50%,0);opacity:1}

#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#sheet.on{opacity:1;visibility:visible}
#sheet .panel{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);background:var(--bg2);border-radius:22px 22px 0 0;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));transition:transform .45s var(--ease)}
#sheet.on .panel{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border-radius:12px;text-align:left;font-size:15.5px;transition:background .2s}
.row:hover{background:var(--card)}
.row svg{width:22px;height:22px;color:var(--gold)}
.row small{margin-left:auto;color:var(--muted)}
.info{font-size:13px;color:var(--muted);line-height:1.5;padding:10px 6px 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .item.rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c46a"/><stop offset=".55" stop-color="#c9952f"/><stop offset="1" stop-color="#9a6b17"/></linearGradient>
    <linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d2"/><stop offset="1" stop-color="#f0c766"/></linearGradient>
    <symbol id="flame" viewBox="0 0 100 100">
      <path fill="url(#fg1)" d="M50 4C55 21 76 33 77 59C78 80 65 95 50 95C35 95 22 82 22 64C22 49 31 41 35 30C37 40 40 46 45 49C42 34 45 19 50 4Z"/>
      <path fill="url(#fg2)" d="M50 43C55 54 64 60 63 73C62 84 57 89 50 89C43 89 37 84 37 75C37 67 43 62 46 55C47 61 49 64 53 65C53 58 51 51 50 43Z"/>
    </symbol>
  </defs>
</svg>

<div id="splash">
  <svg class="flame"><use href="#flame"/></svg>
  <div class="splash-t">Hinário</div>
  <div class="splash-s0">A Luz do Mundo</div>
  <div class="splash-s" id="splashS">Preparando os hinos…</div>
  <div class="bar"><i id="barI"></i></div>
</div>

<div class="app">
  <header id="hdr">
    <div class="top">
      <svg class="flame"><use href="#flame"/></svg>
      <h1 id="ttl">Hinário<small>A Luz do Mundo</small></h1>
      <button class="icon-btn" id="favBtn" aria-label="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="Buscar por número, título ou letra…" autocomplete="off">
      <button id="clear" class="icon-btn" style="width:28px;height:28px" aria-label="Limpar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </label>
    <nav class="tabs" id="tabs">
      <span class="ind" id="ind"></span>
      <button data-t="num" class="on">Número</button>
      <button data-t="az">A–Z</button>
      <button data-t="fav">Favoritos</button>
      <button data-t="rec">Recentes</button>
    </nav>
  </header>
  <main id="list"></main>
</div>

<div id="rail"></div>
<div id="bubble"></div>

<div id="install">
  <div class="mini"><svg class="flame"><use href="#flame"/></svg></div>
  <p id="instTxt"><b>Instale o Hinário</b>Use como aplicativo, mesmo sem internet.</p>
  <button class="btn" id="instBtn">Instalar</button>
  <button class="icon-btn" id="instX" style="width:32px;height:32px" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<section id="view" aria-hidden="true">
  <div class="vbar">
    <button class="icon-btn" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vt" id="vt"></div>
    <button class="icon-btn star" id="vStar" aria-label="Favorito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></button>
    <button class="icon-btn" id="vTheme" aria-label="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
  </div>
  <div id="progress"></div>
  <div id="vscroll"><article class="page" id="hymn"></article></div>
  <div class="navb">
    <button class="icon-btn" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="fs"><button id="fsM" aria-label="Diminuir letra">A−</button><button id="fsP" aria-label="Aumentar letra" style="font-size:21px">A+</button></div>
    <button class="icon-btn" id="next" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</section>

<div id="sheet"><div class="panel">

ventude,","E pode salvá-las se a Cristo se achegam,","Com solicitude."]}]},{"n":9,"x":false,"t":"AGORA, SENHOR","r":"HB. 11:16 ELEIÇÃO · JOÃO. 14:6 GRAÇA","b":[{"k":"v","l":["Agora, Senhor que me encontro ao teu lado,","Fugiu a tristeza do meu coração,","Meu cálice transborda com tua benção","Por isso te louvo bendito Senhor."]},{"k":"c","l":["Guia-me ó,","Cristo!","Sim guia-me,","Guia-me Senhor, //junto a ti// sim, guia-me;","Que nada no mundo me aparte de ti."]},{"k":"v","l":["Formosa é a senda que tu nos mostraste,","Não há outro caminho em que se ache a paz,","Tu és vida eterna, ó fonte divina!","Oh, senda gloriosa de luz e verdade!"]},{"k":"v","l":["Minh’ alma aproveita tua graça divina,","Com grande regozijo tributo louvor,","Teu amor me completa, teu amor me satisfaz,","Por isso te louvo bendito Senhor."]}]},{"n":10,"x":false,"t":"A JESUS CRISTO VEM","r":"IS 55:1 BATISMO · MT. 11:28 CHAMAMENTO","b":[{"k":"v","l":["A Jesus Cristo vem sem demorar,","Que conosco hoje Ele está,","E te convida ao bem-estar","Terno, dizendo: Vem!"]},{"k":"c","l":["Oh!","Quão grata é nossa reunião,","Quando lá,","Senhor na tua mansão,","Contigo estejamos em comunhão,","Gozando eterno bem."]},{"k":"v","l":["Pensa que só Ele pode mudar,","Teu triste peito em gozo e paz,","E porque anseia teu bem-estar,","Volta a te dizer: Vem!"]},{"k":"v","l":["Sua voz escuta sem vacilar,","E grato aceita o que hoje dá,","Talvez amanhã não haverá lugar,","Não, não pares: Vem!"]}]},{"n":13,"x":false,"t":"A BATALHA","r":"EC 9:11 LUTAR","b":[{"k":"v","l":["À batalha e à vitória,","Vamos com Deus nosso Rei,","Que com seu braço forte e robusto,","Sempre defende sua grei,","Pois sem temor avancemos,","Entusiasmados pela fé,","Enquanto alegre cantemos,","Glória a Deus, nosso Rei."]},{"k":"c","l":["Não é a vitória dos ligeiros,","Não é dos fortes a paz,","Más dos fiéis em Cristo,","É o eterno solas."]},{"k":"v","l":["À batalha e à vitória,","Quem será este bom Rei?","Quais as tropas que o seguem,","Nesta luta ro servir,","Porque creio que Ele me pode salvar,","Pois promete me levar até o fim,","Onde creio que Ele me pode salvar."]},{"k":"c","l":["Eu lutei a batalha Senhor,","lhe direi, minha carreira ao terminar,","Pois também eu guardei a fé,","Só espero que venhas me-levar."]},{"k":"v","l":["Com aqueles que não têm fé,","No mundo terei que lutar,","Pois eu sendo nascido de Deus,","Do seu amor não me quero separar."]},{"k":"v","l":["Tudo o que terei que sofrer,","Isto não se pode comparar,","Com a glória que Cristo ao vir,","A seu povo tenha que dar."]},{"k":"v","l":["A coroa de justiça está,","Preparada ao que luta até o fim,","O Senhor Justo juiz nos dará,","No dia que terá que vir."]}]},{"n":30,"x":false,"t":"AO SOAR DA TROMBETA","r":"1 TS. 4:16 SANTA CEIA · MC. 13:26 VOLTA DE JESUS CRISTO","b":[{"k":"v","l":["No soar da trombeta,","Nosso coração desperta,","É Jesus que nas nuvens vem já;","De mil anjos rodeado,","De vitória coroado,","Quando Ele, volte em glória. Aleluia!"]},{"k":"c","l":["Oh,","Irmão!","Estás pronto Vives tu já Salvo em Cristo?","Quanta glória!","Aleluia!","Não será?","Voz de júbilo se ouvirá,","Nos céus cantaremos,","Quando Ele, volte em glória.","Aleluia!"]},{"k":"v","l":["Nas bodas do cordeiro,","Ao tomar o pão do Céu,","Para sempre estaremos com Jesus;","Não haverá lágrimas nem pranto,","Pois que tudo será canto,","Quando Ele, volte em glória. Aleluia!"]},{"k":"v","l":["À mesa estaremos, E com Cristo ceiaremos,","Quão felizes não seremos com Jesus!","Pelos séculos e séculos,","Com os anjos e santos,","Reinaremos em sua glória. Eterna luz!"]}]},{"n":31,"x":false,"t":"AO TERMINAR ESTA VIDA","r":"CL 3:4 DORMIR · MT 25:34 ESPERANÇA","b":[{"k":"v","l":["Ao terminar esta vida e para sempre estar,","Livre de toda angústia e sem nenhum pesar;","Ao desfrutar sua presença ó que feliz serei!","Vendo a pátria preciosa e meu Jesus o Rei."]},{"k":"c","l":["Glória, ó que será, ao encontra-lo?","Quando Ele me dirá: entra meu servo fiel.","E por séculos sem fim, na eternidade,","Viveremos mui consolados lá com Ele."]},{"k":"v","l":["Sei que felizes seremos vendo sua doce face,","Quando com Ele moremos e com sua plena paz;","Jamais tentados seremos na eternidade,","Quando nos reunamos ao que nos cuidará."]},{"k":"v","l":["Cristo é minha doce esperança desde que salvo sou,","Ele é minha vida eterna, sei que à glória vou;","Quando com Cristo me encontre, alegria sem fim será,","Pois nem a dor nem a morte, poderão entrar lá."]},{"k":"v","l":["Uma doçura desfruto, desde que salvo sou,","Mel na boca é Cristo sei que à glória vou;","Pois adiante lhe sigo, com meu bom Salvador,","Ele é minha paz e refúgio, Ele é meu bom Pastor"]}]},{"n":34,"x":false,"t":"AMAR-TE OH JESUS","r":"SL. 145:20 CONSAGRAÇÃO · 2 TM. 1:9 CHAMAMENTO","b":[{"k":"v","l":["No soar da trombeta,","Nosso coração desperta,","É Jesus que nas nuvens vem já;","De mil anjos rodeado,","De vitória coroado,","Quando Ele, volte em glória.","Aleluia!"]},{"k":"c","l":["Oh,","Irmão!","Estás pronto Vives tu já Salvo em Cristo?","Quanta glória!","Aleluia!","Não será?","Voz de júbilo se ouvirá,","Nos céus cantaremos,","Quando Ele, volte em glória.","Aleluia!"]},{"k":"v","l":["Nas bodas do cordeiro, Ao tomar o pão do Céu,","Para sempre estaremos com Jesus;","Não haverá lágrimas nem pranto,","Pois que tudo será canto,","Quando Ele, volte em glória. Aleluia!"]},{"k":"v","l":["À mesa estaremos,","E com Cristo ceiaremos,","Quão felizes Nois seremos com Jesus!","Pelos séculos e séculos,","Com os anjos e santos,","Reinaremos em sua glória.","Eterna luz!"]}]},{"n":36,"x":false,"t":"AMO O NOME DE DEUS","r":"SL. 116:1 DIVINDADE · 1 PE. 5:7 CONFIANÇA","b":[{"k":"v","l":["Amo o nome de Deus, amo ao sublime,","Amo ao Senhor que me deu a Salvação;","Amo a mão poderosa e santa,","Que ao secar meu choro, me socorre sim."]},{"k":"c","l":["Os braços onde eu ponho minhas cargas,","Que a minhas lutas serve de consolo,","São eles para mim, toda minha glória,","Por isso canto assim que Cristo me amou."]},{"k":"v","l":["Quando vagava eu sem esperança,","De criminal ação minha alma manchei,","Só seu nome cheio de ternura,","O grande pecado da minha alma tirou."]},{"k":"v","l":["Amo o nome de Deus em minhas lutas,","Pois a fé triunfará na aflição,","Por isso mesmo lhe darei a Glória,","Porque a arma minha é a oração."]},{"k":"v","l":["Me ama também, o sei, eu o compreendo,","Vida me concedeu por sua dor,","Eu deposito todas minhas penas,","E sua santa mão me abençoará."]}]},{"n":38,"x":false,"t":"ANJOS SE PROSTRAM","r":"SL 148:2 DIVINDADE · NM 6:24 HONRA","b":[{"k":"v","l":["Anjos se prostram diante o trono do Senhor,","E dão seus louvores e seus cantos de honra;","Ao Salvador."]},{"k":"c","l":["Também na terra, há anjos de luz,","E dão aleluias ao Senhor Jesus."]},{"k":"v","l":["Grandes e pequenos cantem a Deus,","E o universo inteiro diga com amor;","A seu Senhor."]},{"k":"v","l":["Anunciem na terra que há Varão de Deus,","Com mensagem do alto dando salvação","Na mansão."]},{"k":"v","l":["Mensageiro do Deus alto, Deus cuida de ti,","Com sua igreja sempre unida em santidade","E liberdade."]},{"k":"v","l":["Paz e gratidão tenho em meu coração,","Pela mensagem que me deu o Servo do Senhor","com grande amor."]}]},{"n":40,"x":false,"t":"ANTES DO ROMPER DA ALVA","r":"ALDM ROSALIO RODRIGUEZ · PV. 8:17 AMANHECER · 1 PE 1:16","b":[{"k":"v","l":["CONSAGRAÇÃO","Antes do romper da alva, venho a ti Senhor Jesus,","Para confortar Minh’ alma, a levar sempre tua cruz,","Tu és a porta do céu, que conduz a tua mansão,","Servir-te é o que eu desejo, dum sincero coração."]},{"k":"c","l":["Me sustentarás com tua mão até o dia da tua vinda,","Oh Jesus Rei soberano, só em ti encontro a vida,","Minh’ alma vibra de alegria ao sentir tua benção,","Na noite ou no dia dá-me tua consolação."]},{"k":"v","l":["Nada tenho a te oferecer, toma hoje meu coração,","Que meu anseio é só te ver, ao chegar à tua mansão.","Seguir-te é o que eu anseio em limpeza e santidade,","Tu és meu único consolo por toda eternidade."]}]},{"n":44,"x":false,"t":"AS PRIMEIRAS HORAS","r":"SL5:3 AMANHECERES · SL34.1 LOUVOR","b":[{"k":"v","l":["A primeiras horas da doce manhã,","As flores perfumam seu trono, ó Deus,","E as orações do povo que te ama,","E cantos de glória proclamam teu amor."]},{"k":"c","l":["Também os cristãos te adoram,","A ti supremo Rei, A ti, te cantam vitória,","por teu poder,","A ti excelente Rei, a ti Deus de Israel."]},{"k":"v","l":["A primeiras horas da doce manhã,","A alma contente louva ao Criador,","Seus ricos perfumes e suaves unguentos,","São as orações e o doce cantar."]},{"k":"v","l":["Eu me deitei, dormi e acordei,","Porque me susteve a mão de Deus,","Por isso, contente, bendigo este dia,","O nome bendito do meu Redentor."]},{"k":"v","l":["Bendito seja o nome de Cristo Jesus,","Que estende sua mão e dá proteção,","Que com sua destra sustenta as almas,","Por isso a seu nome, damos louvor."]}]},{"n":45,"x":false,"t":"ASSIM COMO SE ACERCA","r":"TG 5:8 ELEIÇÃO · 2 PE 3:9 VOLTA DE JESUS CRISTO","b":[{"k":"v","l":["Assim como se acerca a alva,","Também se acerca sua vinda,","Por isso Minh’ alma te busca,","Porque Tu és o meu Salvador."]},{"k":"c","l":["ó Senhor, a ti se adorará,","ó Senhor, a ti se louvará;","Porque Tu és o nosso Rei,","E tua misericórdia é para sempre."]},{"k":"v","l":["Longos anos têm passado,","E muitos têm esperado,","Com paciência tua vinda,","Assim cedo te verão."]},{"k":"v","l":["Graças te damos, ó Senhor,","Porque nos deste um novo dia,","Esperamos da tua ajuda,","Para poder vencer Senhor"]}]},{"n":46,"x":false,"t":"SOZINHO AO HORTO","r":"C AGUSTÍN MILES · CONFIANÇA · CT 2:12 AMANECER","b":[{"k":"v","l":["Sozinho ao horto eu vou,","Quando ainda dorme a floresta","E em quietude e paz com Jesus estou","Ouvindo absorto a sua voz."]},{"k":"c","l":["Ele comigo esta, posso ouvir sua voz","E que seu, diz, serei;","E o encanto que acho nEle aí","com ninguém ter poderei."]},{"k":"v","l":["Tão doce é a voz do Senhor","Que as aves guardam silêncio,","E somente se ouve essa voz de amor","Que imensa paz à alma dá."]},{"k":"v","l":["Com Ele encantado estou","Ainda que em torno cheguem as sombras,","Mas me ordena ir, que a escutar eu vou","Sua voz, onde quer a dor esteja."]}]},{"n":47,"x":false,"t":"A SÓS E EM SILÊNCIO","r":"1. CO 6:20 CONSAGRAÇÃO · SL 120:1 CONFIANÇA","b":[{"k":"v","l":["A sós e em silêncio medito,","Contemplo seu divino esplendor,","//E sinto que no fundo da minha alma,","E no meio da calma Tu me falas Senhor//"]},{"k":"v","l":["Eu quero dar-te minha vida,","E fazer do meu corpo um altar,","//Que sinta que em minha alma Tu vives","E tua graça divina comigo tem de morar//"]},{"k":"v","l":["Às vezes, quando estou nas provações,","Clamo a ti: Dá-me ajuda Senhor.","//A voz do Senhor me encoraja,","E ao ouvi-la eu sinto meu consolador//"]}]},{"n":49,"x":false,"t":"A TI SÓ NOSSO REI","r":"ALDM CARMEN GONZÁLEZ · SL 8:9 AMANHECER · SL 24:10 LOUVOR","b":[{"k":"v","l":["A ti só nosso Rei,","a ti só cantaremos,","Porque Tu tens poder,","a teu nome louvaremos"]},{"k":"c","l":["A ti Rei da glória,","somente a ti cantamos,","Louvores ao seu nome,","Na terra e nos céus."]},{"k":"v","l":["A ti só nosso Pai,","a nosso Rei soberano,","A ti damos nossos cantos,","Porque Tu és o nosso amparo."]},{"k":"v","l":["A Jesus damos louvor e damos adoração,","Para proclamar o nome,","De Jesus o Salvador"]}]},{"n":56,"x":false,"t":"DEBAIXO DAS ESTRELAS","r":"LC 22:44 ORAÇÃO · JO. 15:13 AMOR","b":[{"k":"v","l":["Debaixo das estrelas andou meu Jesus,","No jardim de Getsêmani;","Onde luz não se achou, Cristo se ajoelhou,","Quando orou debaixo do olival."]},{"k":"c","l":["//Debaixo do Olival //","Foi meu Cristo sozinho a orar;","Seja sua vontade, ó Pai Celestial!","Ele clamou, Debaixo do olival."]},{"k":"v","l":["Abundante suor sua testa cobriu,","Como sangue vertido na dor,","Veio um anjo do céu e o confortou,","Quando orou debaixo do olival."]},{"k":"v","l":["Sua tristeza e dor o Pai lhe mudou,","Infundindo-lhe força e coragem;","Confortado saiu e a morte se entregou,","Para salvar o mais vil pecador."]},{"k":"v","l":["Sempre seja minha canção, o amor que mostrou,","Meu Jesus quando orou no jardim;","Glória seja dada a Ele, minhas culpas Ele levou,","Quando orou debaixo do olival."]}]},{"n":57,"x":false,"t":"BARRO EM TUAS MÃOS","r":"RM 9:20 CONSAGRAÇÃO · JR 18:6 ORAÇÃO","b":[{"k":"v","l":["//barro em tuas mãos, eu quero ser//","Mas se tu queres, podes me fazer a tua maneira,","Pois para isso eu vim a Ti."]},{"k":"c","l":["E se vivemos, para Ele vivemos;","E se morremos, para Ele morremos.","Seja que vivamos ou que morramos,","////somos do Senhor////"]},{"k":"v","l":["//Vaso de honra eu quero ser//","Mas se tu queres, podes me fazer a tua maneira,","Pois para isso eu vim a ti."]}]},{"n":61,"x":false,"t":"BENDITA PAZ","r":"ALDM RODOLFO ALVARADO · JR. 1:16 ELEIÇÃO · AT 26:15 HONRA","b":[{"k":"v","l":["Bendita paz que ressoou na terra,","Voz do Senhor dos céus descendeu","Mistério oculto que o homem não sabia,","Por isso perdido vagava no erro."]},{"k":"c","l":["A ti, Varão bendito, foi a Eleição santa,","A ti, o saber divino, Deus te concedeu,","Hoje com gozo unidos louvamos,","Damos glórias ao que te levantou;","E hoje teus filhos todos unidos,","Confirmamos Apóstolo ele é de Deus."]},{"k":"v","l":["Foi tua eleição ordenação bendita,","E em teu cérebro se gerou a luz,","Luz que ilumina o caminho do perdido,","Pela doutrina que Deus te revelou."]},{"k":"v","l":["As trevas sumiram ao romper a Alva,","No dia feliz que Deus te levantou,","Varão Apóstolo maior que teus irmãos,","Por ser promessa que a seu povo deu."]}]},{"n":63,"x":false,"t":"BENDITO SEJA O REI","r":"AP 19:6 LOUVOR · AT 1:14 GOZO ESPIRITUAL","b":[{"k":"v","l":["Bendito seja o Rei dos reis,","Que com seu braço forte nos livrou;","Bendito seja seu santo nome,","Porque Ele nos deu grande proteção;","Glória a Jesus Cristo!","O qual é digno de adoração."]},{"k":"c","l":["Glória a Cristo, meu Rei! Glória ao meu grande Rei!","Aleluia louvemos para Ele! por seu grande poder."]},{"k":"v","l":["Grande alegria e contentamento,","Há na igreja santa do Senhor,","Por ver cumprido até este dia,","Estar unidos todos em amor;","Todos louvando, a Jesus Cristo,","O Rei de Sião."]},{"k":"v","l":["Igreja santa do fiel Cordeiro,","Hoje é o dia de louvar a Deus,","Pelas virtudes e as proezas,","Que tem derramado Cristo o Salvador.","Glória a Jesus Cristo!","O qual derrama sua bênção."]},{"k":"v","l":["A Jesus Cristo o Rei dos reis,","Que está sentado em sua majestade;","Seja seu nome glorificado,","Porque Ele venceu ao feroz tentador,","Por seu poderio, o qual domina sobre o dragão"]}]},{"n":70,"x":false,"t":"CADA PASSO","r":"Sl . 119:133 EXORTAÇÃO · Sl . 137:11 CONSAGRAÇÃO","b":[{"k":"v","l":["Cada passo que dás na senda em que vás,","Há um Deus que te vê; não poderás ocultar","A esse Deus teu duvidar, // Ele te vê //"]},{"k":"c","l":["//Deus te vê //, olha bem o caminho em que vás.","//Deus te vê//, enganá-lo jamais não poderás."]},{"k":"v","l":["Não poderás ocultar a esse Deus teu duvidar,","//Ele te vê //","Ele conhece o pensar e teu desejo de obrar,","//Ele te vê //"]},{"k":"v","l":["Não tenhas temor à prova ou a dor,","Há um Deus que te vê;","Da sua graça infinita Ele te dá do seu amor,","// Ele te vê //"]}]},{"n":71,"x":false,"t":"CAMINHANDO","r":"ALDM LUZ SANDOVAL · Êx 13:21 SANTA CEIA · Jo. 14:2 ESPERANÇA","b":[{"k":"v","l":["Caminhando, caminhando à cidade de Sião,","Onde mora Jesus Cristo meu bendito Salvador,","Onde mora o Rei do céu e do mundo vencedor."]},{"k":"c","l":["Sião do Cordeiro, mansão celestial,","Morada que Cristo foi preparar,","Ali recebe a todos aqueles,","Que a preço de sangue veio comprar."]},{"k":"v","l":["Caminhando e Recordando, Quando Cristo disse assim:","//Anda nega-te a ti mesmo, traz tua cruz e vem a mim//"]},{"k":"v","l":["Caminhando e Recordando,","Quando deu a última ceia; //Seu sangue do novo pacto,","Nos trouxe a vida eterna//"]},{"k":"v","l":["Caminhando e Recordando,","Quando falou com claridade: // Todo aquele que vem a mim,","Se está morto viverá//"]}]},{"n":79,"x":false,"t":"PERTO DE TI SENHOR","r":"","b":[{"k":"v","l":["Perto de ti Senhor, quero morar,","Teu grande e terno amor, quero gozar,","Preenche meu pobre ser, limpa meu coração,","Faz-me teu rosto ver em comunhão."]},{"k":"v","l":["Passos incertos dou, o sol se vai,","Mas se contigo estou, não temo já,","Hinos de gratidão fervente cantarei,","E fiel a ti, Jesus sempre serei."]},{"k":"v","l":["Dia feliz verei confiando em ti,","Em que eu morarei perto de ti;","Minha voz louvará teu doce nome ali,","E minha alma gozará perto de ti."]}]},{"n":80,"x":false,"t":"PERTO, MAIS PERTO","r":"Sl 34:18 CONSAGRAÇÃO","b":[{"k":"v","l":["Perto, mais perto, ó Deus de Ti!","Perto eu quero minha vida levar;","Perto, mais perto, ó Deus de Ti!","//Perto a sua graça que pode salvar //."]},{"k":"v","l":["Perto, mais perto, qual pobre sou,","Nada Senhor te posso oferecer;","Só meu ser, contrito te dou,","// Possa contigo, a paz obter //."]},{"k":"v","l":["Perto, mais perto, Senhor de ti,","Quero ser seu deixando o pecar,","Gozes do mundo vãos aqui;","// Todo senhor logo quero deixar //"]},{"k":"v","l":["Perto, mais perto, enquanto meu ser,","Alente vida e procure sua paz,","E quando ao céu possa ascender.","// já para sempre contigo estarei //"]}]},{"n":82,"x":false,"t":"COMO O PERFUME","r":"Ap. 8:3 ORAÇÃO · 1 Jo 3:2 ADVENTO","b":[{"k":"v","l":["Como o perfume qual formoso aroma exala,","Como o perfume que desprende bom aroma,","Como o incenso que a Jesus Cristo se oferece,","É a oração cheia de fé, cheia de amor."]},{"k":"c","l":["É, pois, a fé, a demonstração","Das coisas que não se veem;","Mas sabemos que quando Ele aparecer,","Seremos semelhantes, assim como Ele."]},{"k":"v","l":["O incensório do incenso está na mão,","Do anjo santo que serve ao redentor;","Porque seu povo sempre continua exalando,","As orações que perfumam ao Senhor."]},{"k":"v","l":["Pela oração,","Elias fez descer fogo,","E pela fé,","Josué logrou parar o sol,","E Jesus Cristo pela fé fez grandes coisas,","Por sua justiça aos céus ascendeu."]}]},{"n":83,"x":false,"t":"COMO A AURORA","r":"ALDM JOSÉ PÉREZ · Ap 7:13 ELEIÇÃO · 1 Co 15:41 HONRA","b":[{"k":"v","l":["Como aurora que resplandece,","Desaparece a escuridão.","Como a chuva no secadal,","Assim é você com sua autoridade.","E a doutrina que Deus lhe deu,","Dará seu fruto de santidade,","E um cântico novo entoarão,","Pela eleição que em seus ungidos veio a brilhar."]},{"k":"c","l":["Quem são?","Os que cantem a canção,","Quem são?","Os de vestiduras brancas.","Quem são?","Os que estarão com o cordeiro,","Quem são?","Os que aceitaram sua autoridade."]},{"k":"v","l":["O firmamento está engalanado,","Com as estrelas, a lua e sol;","A ti também Cristo adornou, com as virtudes e a eleição.","Cantem as aves e rouxinóis,","Soem os rios, também a mar,","Anjos cantem, cantemos todos;","Que Deus abençoe sua dignidade."]},{"k":"v","l":["Cetro de glória, o Senhor lhe deu,","Coroa formosa Deus lhe cingiu;","Com pérolas finas está enfeitado,","Pérolas lindas, diamantes são.","As almas fiéis que já triunfaram,","Adornos puros de grande valor;","Formosa glória o Senhor lhe deu Resplandecente por sua eleição!"]}]},{"n":88,"x":false,"t":"COM CRISTO QUERO","r":"Sl . 17:8 CONSAGRAÇÃO · Sl . 17:8 IMPLORAR","b":[{"k":"v","l":["Com Cristo quero eu ficar,","Suas maravilhas contemplar;","Eu aos seus pés alcançarei","A glória do meu Deus e Rei."]},{"k":"c","l":["Oh guarda-me Senhor Jesus,","Mais fiel a ti, junto a tua cruz;","Ensina-me tua vontade,","E guarda-me em santidade."]},{"k":"v","l":["Faz-me paciente na dor,","Fornece-me tua proteção;","Eu nunca quero desmaiar,","Sempre firme por meu Rei."]},{"k":"v","l":["Dá-me mais fé meu Salvador,","Concede-me de tua coragem;","Concede-me mais firme fé,","Eu te quero ser fiel Senhor."]}]},{"n":92,"x":false,"t":"COM GRATIDÃO, OH SANTO DEUS","r":"Mt 26:7 GRATIDÃO · Sl 136:1 LOUVOR","b":[{"k":"v","l":["Com gratidão, ó santo Deus,","Bendiz Minh' alma tua bondade;","Há no meu peito a doce canção,","Que só Tu sabes amar."]},{"k":"c","l":["É para sempre tua bondade,","É para sempre teu amor;","Tua graça é doce e sem igual,","Porque Tu só és amor."]},{"k":"v","l":["Com gratidão venho para Ti,","Para render-te adoração;","Trago meu ser lavado já por ti,","Na lavacro meu Jesus."]},{"k":"v","l":["Tu me livraste Salvador,","Dos meus caminhos de maldade;","Meus dias tristes passaram já,","Desfruto de paz e a liberdade."]},{"k":"v","l":["Recordo sempre tem que ser,","O sacrifício de Jesus;","Que por amor ao mais vil pecador,","Carregou minhas culpas na cruz."]},{"k":"v","l":["Oferta viva de louvor,","Na tua presença oferecerei,","Com o perfume de teu imenso amor,","Feliz eu sempre viverei."]}]},{"n":93,"x":false,"t":"COM O SANGUE PRECIOSO","r":"2 Co 5:17 CONSAGRAÇÃO · Jo 13:15-17 CONFIANÇA","b":[{"k":"v","l":["Com o sangue precioso que na cruz derramou,","Uma senda gloriosa Jesus Cristo marcou;","Eu por ela caminho sem temor de cair,","Pois meu Cristo divino me sustenta incansável","Com seu grande poder."]},{"k":"c","l":["Com angustia e dor vou caminhando,","A meu Cristo esperando que me guarde em seu amor;","Em seu exemplo marcado, tenho cifrado meu anseio","Até chegar ao céu, onde está meu Jesus."]},{"k":"v","l":["Jesus Cristo é meu guia, Jesus Cristo é minha luz,","É toda minha alegria, é toda minha saúde;","A seu lado eu quero para sempre viver,","Pois dele só espero que recolha minha alma","Ao deixar de existir."]},{"k":"v","l":["Como suaves perfumes das flores de ,","Como o óleo divino espalhado em seu altar;","Assim são as palavras dos filhos de luz,","Dos que encontraram o feliz refrigério,","Que é a paz de Jesus."]},{"k":"v","l":["Assim vou pela vida caminhando na fé,","Com a doce esperança de chegar até Ele;","E com voz amorosa dos seus lábios ouvir,","Com palavras formosas, qual perfume de rosas:","Servo fiel, vem a mim."]}]},{"n":94,"x":false,"t":"COM O QUE PAGAREMOS?","r":"SL. 116:12 AMOR · 1 PE. 1:18 CONSAGRAÇÃO","b":[{"k":"v","l":["Com que pagaremos o imenso amor?","Que deste tua vida por vil pecador.","Senhor Jesus Cristo conforta Minh’ alma,","Para que eu possa vencer na luta,","E servir-te Senhor."]},{"k":"c","l":["Não tenho que te dar por me amar tanto,","Recebe este canto cheio de pranto,","Do meu coração."]},{"k":"v","l":["E quando a noite já estenda seu manto,","Meus olhos em pranto, em ti fixarei,","Alçando meus olhos verei as estrelas,","Eu sei que traz delas qual Pai Amoroso,","Tu zelas por mim."]},{"k":"v","l":["Não te posso pagar com ouro nem prata,","O grande sacrifício que fizeste por mim;","Em troca recebe a oferta humilhada,","A oferta humilhada Senhor Jesus Cristo,","Meu fiel coração."]}]},{"n":97,"x":false,"t":"COM TEU AMOR","r":"1 PED. 1:19 CONSAGRAÇÃO · HB. 4:16 GRAÇA","b":[{"k":"v","l":["Com teu amor e teu sangue precioso,","Me limpaste para sempre ó Jesus,","Hoje caminho na tua senda gloriosa,","//Com tua luz//ó Jesus."]},{"k":"c","l":["Me alimenta tua graça divina,","Me sustenta teu amor que dá paz;","Amor puro esta luz que ilumina,","//De teu amor // dá-me mais."]},{"k":"v","l":["Não permita que eu deixe tua senda,","Por pesada que seja tua cruz,","Faz que minha alma uma chama se acenda,","//De tua luz// ó Jesus."]},{"k":"v","l":["Quando suba contigo aos céus,","Em morada feliz viverei,","Doces cantos de amor e consolo,","///cantarei//"]}]},{"n":103,"x":false,"t":"CRISTO É A FONTE","r":"ATOS. 26:18 BATISMO · JOÃO. 14:6 CHAMAMENTO","b":[{"k":"v","l":["Cristo é a fonte de água de vida,","Para as almas que queiram se salvar,","Arrependidas vindo a seus pés,","Ele teus pecados quer perdoar."]},{"k":"c","l":["Alma não vague errante,","Ouve a voz que te chama,","Vem a fonte de vida,","Fonte de amor e perdão."]},{"k":"v","l":["É Jesus Cristo a porta do céu,","É o caminho para a salvação,","É a verdade que ilumina as almas,","Que arrependidas imploram salvação."]},{"k":"v","l":["Alma perdida que estás . 8:11 RESTAURAÇÃO · Sl . 67:3 LOUVOR","b":[{"k":"v","l":["Do oriente e ocidente virão,","Povos que não conhecem a Jeová,","Virão e adorarão a Jeová,","Cantando louvores a Ele."]},{"k":"c","l":["Povos que não conhecemos virão,","Gente que nunca temos visto,","Rostos que nunca contemplamos,","Contemplaremos louvando a Jeová."]},{"k":"v","l":["De todos os continentes virão,","Todos os escolhidos de Jeová,","Os quais mortos estavam já,","Bendizem hoje ao seu Redentor."]},{"k":"v","l":["O Senhor por seus profetas falou,","Das promessas que Ele fez a Abraão,","Farei de ti uma grande nação,","Essa é a benção do Senhor."]},{"k":"v","l":["Todos os que conhecemos a Deus,","Devemos sempre lhe dar louvor,","Porque em seu grande e doce favor,","Nos trouxe para sermos filhos dele."]}]},{"n":142,"x":false,"t":"DEMOS GRAÇAS","r":"Sl . 9:3 LOUVOR · Gl. 6:9 LUTAR","b":[{"k":"v","l":["Demos graças a Jeová,","Já o inimigo derrotou,","Nossa vitória por Ele foi,","Todos lhe devemos dar louvor."]},{"k":"c","l":["No mundo estamos, contemos a história,","Que Jesus o Cristo veio morrer,","Ninguém desmaie, que já chegaremos,","À pátria eterna, que Ele foi preparar."]},{"k":"v","l":["Ele lutou contra o mal,","A vida já nos concedeu,","Com seu poder Ele já triunfou,","Todos lhe devemos dar louvor."]},{"k":"v","l":["Grande é o Deus da minha vida,","Céu e terra cantem a Ele,","A glória do seu grande poder,","Todos lhe devemos dar louvor."]},{"k":"v","l":["Já era perdida nossa fé, E a esperança de saúde,","Porém meu Deus mostrou seu amor,","Todos lhe devemos dar louvor"]}]},{"n":160,"x":false,"t":"DOCES MOMENTOS DE ORAÇÃO","r":"Hb . 4:16 ORAÇÃO · Sl 119:71 AVIVAMENTO","b":[{"k":"v","l":["Doces momentos de oração,","Os que eu passo no altar,","Quando contrito ao implorar,","Sinto de Deus sua bênção."]},{"k":"c","l":["Irmão //vem// ao altar,","Traz ao Senhor teu coração,","Vem conosco a gozar,","A mais suprema bênção."]},{"k":"v","l":["Se o pranto embriaga minha oração,","Me turba e corta meu implorar,","Ainda chorando e sem falar,","Meu Deus conhece o coração."]},{"k":"v","l":["Deus não despreza ao pecador,","Porém lhe quer perdoar,","Quando humilhado vai ao altar,","Deus dá a seu filho bênção."]}]},{"n":161,"x":false,"t":"O CONSELHO DE DEUS","r":"Is . 28:19 EXORTAÇÃO · Sl . 37:4 GOZO ESPIRITUAL","b":[{"k":"v","l":["O conselho de Deus é para vida,","Os conselhos de Deus são mandamentos,","Confia em Jesus em todo tempo,","Ele te dará consolação e entendimento."]},{"k":"c","l":["Põe assim mesmo teu prazer em Jesus,","E Ele te dará as petições da tua alma,","Vem a Jesus de Coração,","Clama-lhe sempre ao Senhor."]},{"k":"v","l":["Quando na dor estiver, tua alma","Oprimida, Louvarás a Deus toda a vida,","Quando a dor se for e estiveres contente,","Espera em Deus de coração e em todo o tempo."]},{"k":"v","l":["Louvarás a Deus sempre contente,","Não esquecerás jamais seus mandamentos,","Misericórdia e paz terá tua alma,","Espera em Deus de coração e em todo tempo."]},{"k":"v","l":["Quando em pobreza estiveres e sem alento,","Pois tomarás tua cruz que é mandamento,","A esperança do pobre é Jesus Cristo,","Espera em Deus de coração e em todo tempo"]}]},{"n":162,"x":false,"t":"O DIA PREVISTO","r":"IHe 9:28 LOUVOR · 1 Tm 3:14 VOLTA DE JESUS CRISTO","b":[{"k":"v","l":["O dia previsto está perto Cristo Jesus virá,","Aparição tão sublime, todo olho lhe verá;","E fúlgidas multidões, seu trono rodearam,","Cânticos nunca escutados, a esfera inundarão."]},{"k":"c","l":["//Glória// ao Senhor, Rei pela eternidade,","//Glória// ao Senhor, seu povo exclamará;","Glória, aleluia, seu povo exultará,","A seus fiéis crentes em glória levará."]},{"k":"v","l":["Para o rebanho escolhido não haverá confusão,","Morarão perpetuamente em perenal mansão;","As lágrimas e quebrantos desaparecerão,","Por sempre dita indizível com Cristo gozarão."]},{"k":"v","l":["Lutuosas horas que oprimem meu frágil ser aqui,","Mas divinal refrigério terei em Jesus ali;","Não importam as espinhas que ferem com  vem a levantar os seus,","E dar o pago a este mundo infiel."]}]},{"n":180,"x":false,"t":"NO HORTO DE JEOVÁ","r":"SL. 100:1 EXORTAÇÃO · AP. 5:13 LOUVOR","b":[{"k":"v","l":["No horto do Senhor há muitas plantas,","Que exalam um perfume delicioso,","O qual chega até o trono celestial,","Onde mora o Todo Poderoso."]},{"k":"c","l":["Todos cantem aleluias ao Cordeiro,","Todos digam que Jesus é nosso Rei,","Nos vai guiando pelo árido caminho,","Para levarmos a desfrutar, lá com Ele."]},{"k":"v","l":["Hoje o povo que Jesus redimiu,","Dá aleluias ao Cordeiro celestial,","E terá que vencer ao inimigo,","Porque tem confiado no Pai celestial."]},{"k":"v","l":["Quando a tribulação pode me cansar,","Elevo minha oração ao redentor,","E a resposta chega em instantes,","Do Mestre, nosso fiel consolador."]}]},{"n":181,"x":false,"t":"NO MONTE CALVÁRIO","r":"GL. 6:14 PAIXÃO · TIA. 1:12 CONSAGRAÇÃO","b":[{"k":"v","l":["No monte calvário estava uma cruz,","Emblema de afronta e dor,","Oh, eu amo a Jesus! Que morreu na cruz,","Para salvar o mais vil pecador."]},{"k":"c","l":["Oh eu sempre amarei a Jesus!","Em seus triunfos minha glória será,","E algum dia em vez de uma cruz,","Minha coroa Jesus me dará."]},{"k":"v","l":["Ainda que o mundo despreze a cruz de Jesus,","Para mim tem muita atração,","Pois nela levou o Cordeiro de Deus,","Da minh’ alma a condenação."]},{"k":"v","l":["Na cruz de Jesus, onde seu sangue verteu,","Beleza contemplo sem igual,","Pois nela, triunfante a morte venceu,","E meu ser pode santificar."]},{"k":"v","l":["Eu serei sempre fiel em seguir a Jesus,","Seus desprezos por Ele levarei,","E algum dia feliz com os santos em luz,","Para sempre sua glória verei."]}]},{"n":183,"x":false,"t":"NO SEIO DA MINHA ALMA","r":"","b":[{"k":"v","l":["No seio da Minh ‘alma a uma doce quietude,","Difunde-se enchendo meu ser,","Uma calma infinita que só poderão","Os amados de Deus compreender."]},{"k":"c","l":["//Paz// quão doce paz!","É aquela que o Pai me dá,","Eu lhe peço que inunde por sempre meu ser","Em suas ondas de amor celestial."]},{"k":"v","l":["Que tesouro eu tenho na paz que me deu,","E no fundo da alma ficará,","Tão segura que ninguém tirá-la poderá,","Enquanto olho os anos passar."]},{"k":"v","l":["Esta paz inefável consolo me dá,","Descansando somente em Jesus;","E nenhum perigo minha vida terá,","Se me sinto inundado em sua luz."]},{"k":"v","l":["Sem cessar eu medito naquela cidade,","Onde o autor da paz hei de ver;","E em que o hino mais doce que ali cantarei,","Ao estar com Jesus tem de ser."]},{"k":"v","l":["Alma triste que em forte conflito se vê,","Só e fraca sua senda seguir,","Faz de Cristo o Hinário","amigo, que fiel sempre é,","A Luz Do Mundo","E sua paz poderás receber!."]}]},{"n":189,"x":false,"t":"EM GÓLGOTA","r":"Mt. 26:29 SANTA CEIA · Ef. 1:14 ESPERANÇA","b":[{"k":"v","l":["Em gólgota Jesus morreu, Victoria ali ganhou,","Dos meus pecados e maldade, já me libertou","E livre de pecado, pena culpa e juízo aqui,","Me levará a sua glória eterna ali."]},{"k":"c","l":["Ao céu eu irei, a Cristo ali verei,","Lar de paz onde reina eterna luz;","Sua luz e o Senhor, lá não haverá dor","Irmão meu lá te quero ver."]},{"k":"v","l":["Nas pisadas de Jesus já vou a eterna luz,","Minhas lágrimas enxuga, ele me livra da dor;","Em sendas arriscadas me guarda por seu amor,","Que doce é caminhar com meu Jesus."]},{"k":"v","l":["Meu lar está nos céus, minha bandeira é o amor,","Em prós da minha herança seu espírito me deu;","Minha proteção é a palavra Santa do senhor,","Por graça vou a meu celeste lar."]}]},{"n":193,"x":false,"t":"NAS ONDAS IMENSAS","r":"MT. 8:24 CONFIAR","b":[{"k":"v","l":["Nas ondas imensas do embravecido mar,","Que assopra em minha alma, a pobre embarcação,","De joelhos a Cristo clamei, e o furacão,","Desfeito foi num instante a voz de Deus."]},{"k":"c","l":["É Cristo a rocha, a âncora da minha fé,","Os males, lamentos, e gritos de temor,","Terminam para sempre com meu glorioso Rei,","E Jesus Cristo é meu refúgio."]},{"k":"v","l":["Guarda-me dos perigos, das provas e da dor,","Ele manda que os ventos não agitem tempestade,","Os mares se acalmam, as ondas se detêm,","E em Cristo fixo a âncora confiando mais."]},{"k":"v","l":["Meu doce Salvador, sim, meu formoso amigo Ele é,","Que livra da tristeza e afasta o amargo fel,","Pela fé irei ao céu, mansão do ser de amor,","A fonte inesgotável de alegria e bem."]}]},{"n":194,"x":false,"t":"NAS TREVAS","r":"ALDM MANUEL RODRIGUEZ · Mt 14:16 ELEIÇÃO · Is . 60:1 RESTAURAÇÃO","b":[{"k":"v","l":["Nas trevas a luz resplandeceu,","Com seu fulgor ilumina meu coração,","E agora caminho sem tropeçar em pedra,","Porque me ilumina a palavra de Deus."]},{"k":"c","l":["E o povo assentado nas trevas viu grande luz,","E aos assentados em regiões e sombra de morte,","Luz lhes esclareceu, dessas densas trevas,","Meu Jesus, dessas densas trevas me tirou."]},{"k":"v","l":["Levanta-te, resplandece que chegou,","A luz de Cristo Jesus nosso Salvador.","E brilharemos como a luz da aurora,","E iluminaremos como resplandece o sol."]},{"k":"v","l":["O sol para as trevas se criou,","O sol e a lua o que nosso Deus formou,","E um Apóstolo para os pecadores,","Entre os quais me encontrava eu."]}]},{"n":198,"x":false,"t":"EM PECADO ME ENCONTROU JESUS","r":"Col.2:13 INTERCESSÃO · 1 Ti.2:6 GOZO","b":[{"k":"v","l":["Em pecado me encontrou Jesus,","E me deu resgate, glória a Ele;","Me limpou de toda minha maldade,","Me encheu com seu espírito."]},{"k":"c","l":["Dia alegre quando Ele me achou, Me tirou da escuridão;","Jogou meus pecados no profundo mar,","E encheu Minh ´alma de gozo e paz.","Dia de gozo, ó aleluia, dia de gozo foi para mim,","Cantarei e darei hosanas,","Em glória quando estamos lá com Ele."]},{"k":"v","l":["Livra-me de toda a tentação,","Salva-me de toda persecução,","Livra-me de toda a perdição,","E serei sempre fiel ao senhor."]},{"k":"v","l":["Quando estivermos com Cristo lá na glória,","Cantaremos em um coro celestial,","Disfrutaremos de uma vida eternal,","Quando estivemos lá com Ele."]},{"k":"v","l":["Não esqueças, Deus de minha saúde,","Ajudar-me com teu grande poder,","O inimigo eu poderei vencer,","Por que Tú és meu ajudador."]}]},{"n":202,"x":false,"t":"NUM MONTE QUE DEUS","r":"Rm 8:35 PAIXÃO · 1 Pe 1:11 CONSAGRAÇÃO","b":[{"k":"v","l":["Num monte que Deus sendo o Criador,","Lugar propenso a maldição,","Pendurado foi um varão;","Em imensa dor derramou o coração,","Por salvar a humanidade da condenação."]},{"k":"c","l":["Quem do seu amor me afastará?","Angústia ou tribulação?","Perigo ou perseguição?","Fome ou nudez?","Quem poderá nos condenar?","Jesus na cruz morreu;","A vida eterna me espera lá,","A plenitude da sua Bondade."]},{"k":"v","l":["Eterna solidão foi sua morada,","O campo do desprezo foi sua humilde habitação;","O Cordeiro de Deus, ó quanto sofreu!","Seu sofrimento, a meu ser comoveu."]},{"k":"v","l":["Sabedoria de Deus, regou a sua alma,","Com o Onipotente Deus estava sua saúde;","Mas em seu dever de falar a verdade,","Levou em sua vida o pecado por mim."]}]},{"n":203,"x":false,"t":"EM UM TEMPO DE ACEITAÇÃO","r":"LDM Horácio de lá paz · ELEIÇÃO","b":[{"k":"v","l":["Num tempo de aceitação ó Apóstolo de Deus,","Tua palavra de amor nos deu um viver melhor,","Somos gente feliz, alegres por crer na tua eleição,","Nossas almas são o fruto do teu amor."]},{"k":"c","l":["Amamos tua Eleição por tudo o que nos dá,","Formoso é viver desfrutando de tua amizade,","Amamos tua eleição bendita e preciosa é,","Qual chuva desceu, na Minh ‘alma gerou a fé,","Eu te levo no coração, tu me levas a uma cidade,","Donde um dia verei formosa eternidade."]},{"k":"v","l":["E gloriosa a compreensão que teus filhos desfrutam hoje,","Por que é uma fé e uma é o amor,","A doutrina que Deus te deu num povo nos uniu,","Milhares de almas hoje proclamam tua Eleição."]},{"k":"v","l":["Hoje teu povo sente a paz, tão preciosa felicidade,","Os carinhos que Deus por Ti a alma dá,","Ao estar junto a Ti a alma não se pode resistir,","Pois conhece o que há dentro de ti."]},{"k":"v","l":["ó, que benção poder gozar de tua Santa autoridade,","O Divino poder que pode liberar,","O que ligares aqui, ligado nos céus estará,","Por que toda potestade em Ti está."]}]},{"n":204,"x":false,"t":"EM UM TEMPO EU FUI","r":"LC.9:56 CHAMAMENTO · Ef.4:8 GOZO","b":[{"k":"v","l":["Em um tempo eu fui prisioneiro,","Aprisionado pôr o vil tentador;","O pecado me tinha ligado,","Em densa escuridão e cruel dor."]},{"k":"c","l":["Se escutas hoje a voz do Salvador,","Mesmo que estejas em terrível prisão,","A liberdade te oferece meu Senhor,","Receberás de Cristo o perdão."]},{"k":"v","l":["Vêm cativo e aceita o perdão,","O Senhor tuas culpas tirará;","Cristo veio a salvar a os perdidos,","E dar aos cativos liberdade."]},{"k":"v","l":["Chegou a hora em que fui libertado,","O Senhor minhas algemas quebrou;","Cristo veio a salvar a os perdidos,","E a dar aos cativos liberdade."]}]},{"n":205,"x":false,"t":"ERAM CEM OVELHAS","r":"Lc 15:4 BATISMO · Ez 34:22CHAMAMENTO","b":[{"k":"v","l":["Eram cem ovelhas juntas no rebanho,","Eram cem ovelhas que amante cuidou;","Porém numa tarde ao contá-las todas,","//Lhe faltava uma// e triste chorou"]},{"k":"c","l":["As noventa e nove deixou no aprisco,","E pelas montanhas a buscá-la foi,","A encontrou gemendo, tremendo de frio,","//Curou suas feridas// e ao redil voltou."]},{"k":"v","l":["Esta mesma história volta a se repetir,","Ainda há ovelhas que vagando vão;","Vagando no mundo, longe do redil,","//Sem Deus, sem consolo// e sem seu perdão."]}]},{"n":208,"x":false,"t":"É APOSTOLO O QUE DEUS","r":"LDM PRAXEDIS ALONSO · EC 10:20 ELEIÇÃO · NÚM. 16:1-45 REPREENSÃO","b":[{"k":"v","l":["É apóstolo o que Deus tem enviado,","Nunca levantes contra dele murmuração;","As donzelas de ontem admiradas estão,","De está igreja que se levantou;","E a esposa escolhida de Deus,","Que a luz da lua brilhou."]},{"k":"c","l":["Goza igreja Santa, tua luz já chegou,","Tremam hoje os falsos,","Por que destruíram os caminhos do Senhor.","A voz do bom pastor já o povo conheceu;","Por isso é que os estranhos,","Não reconhecem as ovelhas em sua voz."]},{"k":"v","l":["Sou o Deus que ordenou destruição,","Contra Corá, contra Datã e Abirão,","Por haver levantado seu juízo pra mim,","Contra o Servo que eu levantei,","Sendo povo escolhido de Deus,","Da vida seus nomes tirei"]},{"k":"v","l":["É possível que só se cortem","E não derramem a amarguro da sua fel,","Entre um povo de paz, que é a paz de Israel,","De Israel que de jovem amei,","Nunca deves julgar meu saber,","São caminhos que eu ordenei."]}]},{"n":210,"x":false,"t":"É JESUS CRISTO MEU AMIGO","r":"Jn. 15:14 AMIZADE · Sal.139:24 CONFIANÇA","b":[{"k":"v","l":["É Jesus Cristo meu amigo melhor,","Meigo e amante, não há outro igual;","Toda, minha vida descansa em seu amor,","Tão só nele seguro estará."]},{"k":"c","l":["!ó meigo amigo! Perto de Ti,","Tua senda quero sempre seguir;","Eu quero sentir que mora em mim,","Tua Santa graça para viver."]},{"k":"v","l":["Ele em minhas lutas desce até mim,","E faz no meu peito a benção nascer;","Nunca por Ele esquecido me vi,","Nunca faltou seu amor em meu ser."]},{"k":"v","l":["Nas minhas dúvidas me enche de luz,","E encontro a senda que devo seguir;","Tudo em minha vida o devo a Jesus,","Só por Ele eu posso viver."]},{"k":"v","l":["Ele me conduz qual terno pastor,","leva minha vida por senda de paz,","Ele me livra de todo temor,","Me dando o gozo de vê-lo a Ele.."]}]},{"n":212,"x":false,"t":"É JESUS QUEM ALEGRA","r":"1 Pe . 1:8 CHAMAMENTO · Sl . 31:17 CONSAGRAÇÃO","b":[{"k":"v","l":["É Jesus quem alegra minha alma,","É Jesus quem dá paz ao meu ser,","Na pena ou na tristeza Ele me alegra,","E com Ele tudo é felicidade."]},{"k":"c","l":["A pena e a dor, com ele se esquecem,","É Cristo meu Senhor quem dá a paz,","Não esqueça pecador, que Ele o alegra,","Pois só em meu Jesus, gozo terá."]},{"k":"v","l":["Pecador é muito triste sua vida,","De viver longe de meu Jesus,","Veja Ele que com voz amorosa,","Quer o trazer a seu amado redil."]},{"k":"v","l":["Se tu vive hoje longe de Cristo,","Ainda tem remédio à sua dor,","É sua voz que o está chamando,","Pecador não faça duro o coração."]},{"k":"v","l":["Eu também andava em mau caminho,","Triste, fraco, com pena e grande dor,","Ofendendo em tudo a meu Cristo,","Mas agora tenho paz, tenho seu amor"]}]},{"n":213,"x":false,"t":"É A ORAÇÃO O MEIO","r":"Lc. 11:13 AVIVAMENTO · JOÃO. 14:13 ORAÇÃO","b":[{"k":"v","l":["É a oração o meio que o Senhor,","Deixou a sua grei que anda com temor,","Vendo sua palavra nela encontrarás,","Que a oração te leva a Cristo mais e mais."]},{"k":"c","l":["Oh Falar com Cristo que felicidade,","E contar-lhe tudo, tudo em verdade,","Demonstrando-lhe tua necessidade,","Ele te ouvirá do seu trono celestial."]},{"k":"v","l":["Se estás triste, faz uma oração,","Dirija-se à glória com o coração,","É um mandamento que o Senhor deixou,","E terás resposta porque assim o prometeu."]},{"k":"v","l":["Se estás esperando ao Consolador,","Deves esperá-lo, com fé e valor,","E o Senhor ao ver tua fervente prece,","Cumprirá teu gozo dando-te um Consolador."]},{"k":"v","l":["Se não tens resposta, ora mais e mais,","Não desanimes, Cristo não é falaz,","Sempre à sua promessa fiel responderá,","O que necessites o Senhor te dará."]}]},{"n":224,"x":false,"t":"FELIZ MOMENTO","r":"He.9:14 GRATIDÃO · SAL. 119:45 GOZO","b":[{"k":"v","l":["Feliz momento em que escolhi,","Servir-te meu Senhor e Deus;","Preciso é que meu gozo em Ti,","O mostre hoje com obra e voz."]},{"k":"c","l":["//Sou feliz// em seu favor me gozarei,","Em liberdade e luz me vi","Quando triunfo a fé em mim,","E o caudal carmesim,","Saúde para Minh´ alma foi."]},{"k":"v","l":["Com meu dever eu cumpri,","De Cristo sou e Ele é meu;","Me trouxe e com prazer segui","Sua voz conhece todo fiel."]},{"k":"v","l":["Descansa frágil coração,","A tuas lutas põe já fim,","Achei mais nobre possessão,","E parte em superior festim."]},{"k":"v","l":["Solene voto, oferta de flor,","Que ao céu santo consagrei,","Seja meu vínculo de amor,","E testemunho da minha fé."]}]},{"n":225,"x":false,"t":"FIRMES E ADIANTE!","r":"At. 10:23 LUTAR · Mt 16:18 CONFIANÇA","b":[{"k":"v","l":["Firmes e adiante, hostes da fé!","Sem temor algum, que Jesus nos vê,","Chefe soberano Cristo na frente vai,","E a régia ensina tremulando está."]},{"k":"c","l":["Firmes e adiante, hostes da fé,","Sem temor algum que Jesus nos vê."]},{"k":"v","l":["Ao sagrado nome do nosso adalide,","Treme o inimigo e foge da lide,","Nossa é a vitória deem a Deus louvor,","E ouça-o o averno cheio de pavor."]},{"k":"v","l":["Move-se potente a Igreja de Deus,","Dos já gloriosos marchemos empós.","Somos só um corpo e um é o Senhor,","Uma é a esperança e um é nosso amor."]},{"k":"v","l":["Tronos e coroas podem perecer,","De Jesus a Igreja fiel haverá de ser,","Nada contra dela prevalecerá,","Porque a promessa nunca falhará."]}]},{"n":228,"x":false,"t":"FONTE DA VIDA","r":"Sl . 23:12 LOUVOR · Sl 95:2 GOZO ESPIRITUAL","b":[{"k":"v","l":["Fonte da vida eterna e de toda bênção,","Exaltar tua graça terna, deve cada coração,","Tua piedade inesgotável, abundante em perdoar,","//Único ser adorável, Glória a ti devemos dar! //"]},{"k":"v","l":["Dos cânticos celestes te quisermos cantar,","Entoados pelas hostes que lograste resgatar,","Almas que a buscar vieste porque lhes tiveste amor,","//Delas te compadeceste, com terno favor //"]},{"k":"v","l":["Toma nossos corações enche-os da tua verdade,","De teu Espírito os dons e de toda santidade,","Guia-nos em obediência, humildade, amor e fé.","//Nos ampare tua clemência, Salvador propício sê//"]}]},{"n":240,"x":false,"t":"GUIA-ME OH SALVADOR","r":"SL. 5:8 INTERCESSÃO · SL. 27:9 SÚPLICA","b":[{"k":"v","l":["Guia-me ó Salvador, pela via de saúde,","A teu lado não há temor,","Só há gozo, paz, quietude."]},{"k":"c","l":["//Cristo// não me deixes, ó Senhor,","Sendo tu meu guia fiel,","Serei mais que vencedor."]},{"k":"v","l":["Não me deixes, ó Senhor,","Enquan santos redimidos gozoso cantarei","Grandes coisas Cristo têm feito para mim."]}]},{"n":249,"x":false,"t":"HÁ UMA CIDADE","r":"AP. 21:23 ELEIÇÃO · Heb.12:22 ESPERANÇA","b":[{"k":"v","l":["Há uma cidade grande e formosa,","Preciosa cidade onde não há sol,","Ali estarão os que são comprados,","Com o sangre precioso de nosso Senhor."]},{"k":"c","l":["Oh eu quero ir para essa cidade!","Onde morarão os filhos de Deus,","Eu quero viver juntos com o santos,","Anseio estar","Para sempre ali, com o Salvador."]},{"k":"v","l":["A vida de lá, será mais preciosa,","Não tem sofrimento, nem tribulação,","Lá só haverá coros celestiais,","Cantando louvores a nosso Senhor."]},{"k":"v","l":["Sem lua nem sol, será muito lindo,","Nos iluminará o Cordeiro de Deus,","Sem choro ou dor, tudo será gozo,","Cantando louvores a Cristo o Senhor.."]}]},{"n":251,"x":false,"t":"HÁ UMA LUZ","r":"LLDM · SL. 119:5 ELEIÇÃO · JOÃ. 5:39 BÍBLIA","b":[{"k":"v","l":["Há uma luz que ilumina neste mundo,","O Evangelho de Cristo, o Salvador,","Que iluminará do coração o mais profundo,","E ao que vai perdido tira do erro"]},{"k":"c","l":["É o ensinamento de Cristo o Salvador,","Que dos céus nos trouxe a este lugar,","Para que todos obtivéssemos por Ele,","A salvação, a vida e a verdade."]},{"k":"v","l":["Há uma luz que descendeu do céu,","Que ilumina mais que a luz do sol,","Que ao pecador lhe dá alegria, paz e consolo,","E ao que vai perdido tira do erro."]},{"k":"v","l":["Lâmpada é a meus pés tua palavra,","E o ensinamento em meu caminho é luz,","Que iluminará no coração o mais profundo,","E ao que vai perdido tira do erro."]},{"k":"v","l":["Um anjo viu que desceu do céu,","Um grande Apóstolo chamado do amor.","Na sua missão consigo Ele trazia um livro,","O Evangelho da Salvação."]}]},{"n":252,"x":false,"t":"HÁ UMA SENDA","r":"1 PE. 4:4 CHAMAMENTO · JR. 6:16 BATISMO","b":[{"k":"v","l":["Há uma senda que o mundo não conhece,","Há uma senda que eu logrei encontrar,","//Em Cristo tenho a Salvação da minha alma,", u pobre ser, logrei ali lavar,","A glória do /// seu grande poder ///","A glória do seu grande poder, eu me alegro louvar."]},{"k":"v","l":["Eterna fonte ///carmesim///","Eterna fonte carmesim, caudal de puro amor,","Se lavará ///por sempre em ti ///","Se lavará por sempre em ti, O povo do Senhor."]}]},{"n":257,"x":false,"t":"HÁ UM TESOURO","r":"LDM · Tit. 1:13 CONFIANÇA · Mt 6:20 ESPERANÇA","b":[{"k":"v","l":["Há um tesouro incomparável lá nos céus,","Que o pecador sempre busca alcançar,","E caminhando entre espinhos e arbustos,","Rico tesouro que algum dia vamos ter."]},{"k":"c","l":["Ainda que forte tempestade no caminho,","Que castiga Minh´ alma com crueldade,","Mas ansioso aguardo ver o arco-íris,","Anunciando por sempre bela paz."]},{"k":"v","l":["É um palácio mui precioso que eu procuro,","Está escondido trás do céu azul turquesa,","E adornado com estrelas maravilhosas,","E o tesouro que eu busco para mim."]},{"k":"v","l":["É um príncipe precioso o que lá mora,","Ao qual eu desejo conhecer,","Porque fui comprado a preço do seu sangue,","Minha vida Ele mudou com seu poder."]},{"k":"v","l":["É tão bom, tão fino e carinhoso,","Nas minhas provas ele me dá seu poder,","E me anima e me ajuda em meu caminho,","Para que possa sempre eu viver com Ele."]}]},{"n":260,"x":false,"t":"EIS AQUI QUE TU ÉS FORMOSO","r":"Cnt. 1:16 AMOR · Jn. 10:11 GRATIDÃO","b":[{"k":"v","l":["Eis aqui que Tu és formoso, ó redentor,","Jesus meu benfeitor,","Me forneceste teu amor,","E me salvaste por teu amor;","Meu amado é branco e ruivo,","E ressaltado entre dez mil;","E sua cabeça é como ouro,","E Seu esplendor é como o Sol."]},{"k":"c","l":["Cantar dos cantares, canta teu povo,","Tu és formoso, santo Cordeiro,","Dentro da Minh´ alma está marcado em meu coração,","Teu amor é doce ao meu ser."]},{"k":"v","l":["Meu redentor,","Ele é muito formoso,","Com seu amor enche meu oração,","E nos braços de Jesus;","Toma prazer meu coração;","Como o pastor toma sua ovelha,","Assim Jesus mostrou seu amor,","E agora exclamo alçando a voz: Vivo feliz em meu Jesus!"]},{"k":"v","l":["Eu sou de Cristo e Cristo é meu,","O testemunho Cristo já o deu,","Porque marcado está em meu ser,","E eu marcado estou nele.","Posso dizer que sou do meu amado,","E Que meu amado é de mim. e se eu vivo é para Cristo,","E se eu morrer, morro feliz."]}]},{"n":261,"x":false,"t":"NÓS VIEMOS PROCURAR","r":"Sal.111:1 LOUVORES · 2 Co. 6:2 GOZO","b":[{"k":"v","l":["Temos vindo a buscar uma rica benção,","Temos vindo a deleitarmos em esta congregação."]},{"k":"c","l":["Glória cantemos ao Salvador,","Daí louvores ao Redentor."]},{"k":"v","l":["Nós viemos a esta igreja, Coluna da verdade,","Temos vindo a deleitarmos no amor de Jesus."]},{"k":"v","l":["Se há uma alma que sinta dar a Cristo o coração,","Hoje é o dia aceitável para obter o perdão."]},{"k":"v","l":["Sua palavra nos ensina que nós tenhamos amor,","Esta é a chave preciosa para obter o perdão."]},{"k":"v","l":["Na palavra encontramos a vida e a salvação","Isto é se nos congregarmos pelo meio da oração."]},{"k":"v","l":["Gozo sentimos agora em esta congregação,","Porém mais gozo será que almas venham ao Senhor."]}]},{"n":274,"x":false,"t":"HOUVE UM","r":"Is.53:7 PAIXÃO · Rom. 8:1 GRATIDÃO","b":[{"k":"v","l":["Houve quem por Minh' as culpas morre-o na cruz;","Ainda indigno e vil como sou;","Sou feliz pois seu sangue verteu meu Jesus,","E por ela, minhas culpas lavou."]},{"k":"c","l":["Meus pecados levou na cruz onde morreu,","O sublime, e meigo Jesus;","Os desprezos sofreu e Minh 'alma salvou,","E mudou minhas trevas em luz."]},{"k":"v","l":["Ele é meigo e amante não há outro igual,","Pois converte o infiel coração;","E por essa paciência e ternura eu sei,","Que sou livre de condenação."]},{"k":"v","l":["Meu anelo constante é em Cristo viver,","Meu caminho, seu exemplo marcou;","E pra dar-me a vida, Ele quis morrer,","Em sua cruz meus pecados levou."]}]},{"n":276,"x":false,"t":"IGREJA SANTA","r":"SL. 133:1 RESTAURAÇÃO · ATO.12:26 GOZO","b": está inscrito no livro de Deus."]}]},{"n":288,"x":false,"t":"JESUS CRISTO NOS ALEGRA","r":"1 JOÃ. 4:16 AMOR · SL. 133:1COMUNHÃO","b":[{"k":"v","l":["Jesus Cristo nos alegra onde há amor,","Ele dissipa a tristeza onde há amor,","O amor nos faz orar, o amor nos dá prazer,","As trevas se fazem luz; onde há amor."]},{"k":"c","l":["//Onde há amor//","Todo mundo vai cantando, Onde há amor.","//Onde há amor//","Alegria e paz abundam, sempre onde há amor."]},{"k":"v","l":["Todo mundo vive alegre, onde há amor,","Todo o coração se eleva onde há amor,","Toda angústia passará, de paz se gozará,","E tranquilidade haverá onde há amor."]},{"k":"v","l":["Grandioso júbilo existe onde há amor,","Nunca está a vida triste, onde há amor,","Todos têm alegria e paz, todo pranto fica atrás,","E os vícios não existem mais, onde há amor"]}]},{"n":291,"x":false,"t":"JESUS ESCUTA","r":"Sal.61:1 INTERSEÇÃO · Sal. 130:1 SÚPLICA","b":[{"k":"v","l":["Jesus escuta meu clamor, de ti depende meu viver;","Escuta já e pronto vem, a socorrer com teu poder."]},{"k":"c","l":["Tu guardas minha meditação,","Consagra ao falar minha voz;","E livra, Tu, meu coração,","De ir Senhor, do mal em pós."]},{"k":"v","l":["Pela manhã ao raiar, a ti minha voz elevarei;","E qual incenso levarei, minha oração a ti no altar."]},{"k":"v","l":["Ao vislumbrar a luz astral, eu buscarei tua Santa paz,","Meu amor Senhor, aceitaras, qual sacrifício noturnal."]},{"k":"v","l":["Meu bom Senhor se dura é, sua correição receberei,","Com humildade, a santidade, difundirá meu coração."]},{"k":"v","l":["A obscura noite já chegou,","Senhor a ti eu vou com fé;","A paz em Ti encontrarei,","Tua salvação anseio eu."]}]},{"n":292,"x":false,"t":"JESUS É MEU REFÚGIO","r":"SL. 62:7 CONFIAR · JR. 17:17 CONSAGRAÇÃO","b":[{"k":"v","l":["Jesus é meu refúgio, em toda tempestade,","Ele é a rocha firme da eternidade,","O vento não me move, nem me arrebatará,","//Jesus é meu refúgio // nada me faltará."]},{"k":"v","l":["As turbulentas ondas se arrojam sobre mim,","E as escuras noites começam a encobrir,","Minha barca navegando, ao porto vai também,","//Jesus é meu refúgio// nada me faltará."]},{"k":"v","l":["Jesus é o amigo da humanidade,","Ele é a medicina de toda enfermidade,","Não temerei a luta, porque me guardará.","//Jesus é o amigo // da humanidade."]},{"k":"v","l":["Jesus está chamando Ele é o capitão,","Se tu és um soldado, prepara-te também,","Te chama a batalha, venha pronto a defender,","// É Cristo quem te chama //sua voz te diz vem."]}]},{"n":293,"x":false,"t":"JESUS É MEU REI SOBERANO","r":"Col. 1:13 Amor · Col. 1:12 Gozo","b":[{"k":"v","l":["Jesus é meu Rei soberano,","Meu gozo é cantar seu louvor,","É Rei e me vê qual irmão,","É Rei e me comparte seu amor,","Tendo do Pai sua glória, Veio me tirar da escória.","// E eu sou feliz //com Ele."]},{"k":"v","l":["Jesus é meu amigo desejado,","E em sombras ou em luz sempre vai,","Paciente e humilde a meu lado,","Sua ajuda e consolo me dá,","Por isso constante lhe sigo,","Porque Ele é, meu Rei e amigo,","//E eu sou feliz // com Ele."]},{"k":"v","l":["Senhor que poderia eu te dar?","Por tanta bondade para mim?","Basta te servir e te amar?","É tudo, entregar-me a ti?","Por isso aceita minha vida,","Que só a ti está rendida,","//Pois eu sou feliz // por ti."]}]},{"n":298,"x":false,"t":"JESUS EU PROMETI","r":"1 PED. 2:21 INTERCESSÃO · 1 JOÃ. 5:4 CONSAGRAÇÃO","b":[{"k":"v","l":["Jesus eu prometi, servir-te com amor,","Concede-me tua graça meu amigo e Salvador,","Não temerei a luta se tu a meu lado estás,","Não perderei a senda, que tu me guiando vás"]},{"k":"v","l":["O mundo está bem perto e é grande a tentação,","Suave é o engano, e tola a paixão,","Vem tu Jesus mais perto e mostra tua piedade,","Protege minha alma de toda iniquidade."]},{"k":"v","l":["Quando minha mente vague, já incerta e veloz,","Permita-me que escute Jesus tua clara voz,","Anima-me se paro, inspira-me também,","Repreende-me se temo, em tudo fazer o bem."]},{"k":"v","l":["Jesus tu prometeste a todo aquele que vai,","Seguindo tuas pegadas que ao céu chegará,","Sustenta-me no caminho e ao fim com doce amor,","Translada-me a tua glória, meu amigo e Salvador."]}]},{"n":303,"x":false,"t":"JUNTO A TI","r":"ALDM BENJAMIN CHÁVEZ · CONFIANÇA · Ez 16:8 CONSAGRAÇÃO","b":[{"k":"v","l":["Junto a Ti, minha vida eu quero levar,","Junto a Ti, não me importa o que há de passar,","Junto a Ti, para sempre feliz eu serei,","E feliz no céu direi//que triunfei// por ficar junto a ti."]},{"k":"c","l":["Não permitas que te deixe meu Senhor,","Pois eu quero seguir sempre junto a Ti,","Que não há outro amor, como o teu meu Senhor,","Onde vais eu irei, sempre perto de Ti."]},{"k":"v","l":["Junto a Ti, não me assustam as ondas do mar,","Junto a Ti, vencerei toda cruel tempestade,","Junto a Ti, nem os ventos poderão açoitar,","A minha vida jamais perturbar, //sou feliz////,","por ficar junto a Ti."]},{"k":"v","l":["Junto a Ti, às grandes batalhas irei,","Junto a Ti, inimigo gigante não há,","Junto a Ti, na luta com fé e com valor,","Vencerei e triunfante sairei, com sua ajuda eu sei,","vitorioso sairei."]},{"k":"v","l":["Junto a Ti, o ocaso do sol eu verei,","Junto a Ti, ao zênite com alegria irei,","Junto a Ti, na minha vida alegria haverá,","Os meus caminhos serão de verdade;","No céu estarei sempre perto de Ti"]}]},{"n":305,"x":false,"t":"A BÍBLIA É A BANDEIRA","r":"Ro.15:4 BÍBLIA · Efe. 2:19 GOZO","b":[{"k":"v","l":["A bíblia é a bandeira da cidade eterna,","Seus faixas, suas estrelas, nos falam de seu amor; Lugar","de redimidos, refúgio dos pobres,","Comprados com seu sangue a preço de expiação."]},{"k":"c","l":["Eu sou um cidadão da cidade eterna,","Por fé fui recebido, hoje cidadão sou;","É Cristo o governante dessa gloriosa terra,","Acenando sua bandeira, anuncia redenção."]},{"k":"v","l":["Sessenta e seis estrelas, que há na bandeira,","Representa os livros que nela encontraram;","Suas Faixas são doze, suas tribos representa,","O mastro que nela acena, o Cordeiro imortal."]},{"k":"v","l":["De todo povo e raça, de toda tribo e língua,","Se formará uma pátria na celestial Sião;","Lá todos reunidos, embaixo da bandeira,","Cantaremos em glória, em paz e redenção."]}]},{"n":308,"x":false,"t":"A ESPOSA DO CORDEIRO","r":"AP.19:7 RESTAURAÇÃO · Rom.13:11 ADVENTO","b":[{"k":"v","l":["A esposa do Cordeiro se prepara,","Para encontrar ao Senhor, seu esposo e salvador;","Em breve vem nas nuvens com seus santos,","Para levar a sua igreja que comprou."]},{"k":"c","l":["Esta é a igreja de Jesus Cristo,","Estava oculta lá no deserto,","Hoje sai resplandecente,","Como esquadrão imponente,","Para encontrar a seu Senhor,","Que a comprou com seu santo amor."]},{"k":"v","l":["Com vestidos brancos e resplandecentes,","O mesmo Deus colocou, seu vestido espiritual,","E a selou com seu espírito santo,","A levará a seu reino celestial."]},{"k":"v","l":["Quem vença resplandecerá na glória,","E como o sol se verá por toda a eternidade,","E o Senhor Jesus Cristo lhe dará","A vida eterna e coroa lhes dará."]},{"k":"v","l":["Se aproxima a vinda do Senhor,","Também a igreja dele, transbordando está de amor,","A santidade seja sempre escudo forte,","E moraráHinário","naA Luz","cidade","Do Mundo de Sião."]}]},{"n":309,"x":false,"t":"A ESPOSA SE VESTE DE GALA","r":"Ap. 19:7-8 RESTAURAÇÃO · 2 P. 3:14 ADVENTO","b":[{"k":"v","l":["A esposa se veste de gala, De gozo também se adorna,","Porque está esperando seu Salvador,","Que pode ser visto com grande esplendor."]},{"k":"c","l":["Vigia sempre, esposa amada,","Esperando a seu Senhor,","Com vestidos está adornada,","Cumprirá sua fiel missão."]},{"k":"v","l":["Espera sempre em santidade, Em choro e em oração,","E ao final de tudo, terás tua coroa,","Com Jesus o Cristo, na cidade de Sião."]},{"k":"v","l":["De vigia devemos estar, Pois somos a igreja de Deus,","E estar devemos todos em espera,","Sempre esperando o nosso Redentor."]},{"k":"v","l":["O servo bem-aventurado, Que fizesse fiel sua vontade,","Terá que cumprir nele
