a sua promessa,","Foi fiel no pouco , em muito estará."]}]},{"n":310,"x":false,"t":"O MUNDO ME PERGUNTAM","r":"(A LUZ DUM APÓSTOLO) LDM MANUEL ESPINOZA PALAFOX · ELEIÇÃO","b":[{"k":"v","l":["O mundo me pergunta o porquê","Eu mudei meu modo de viver,","Eu vivia em pecado e maldade","Ofendendo em tudo ao Senhor;","Eu era semelhante àquele varão,","Não podia contemplar a luz do sol,","Era cego, inseguro de viver","Pelo mundo de perigo e temor."]},{"k":"c","l":["Mas um dia contemplei a luz do sol","Que brilhava com seu grande esplendor,","Me sentia tão contente,.","Essa luz é um Apóstolo ao ver","A grandeza que meu Deus manifestou de Deus,","Afastou-me das trevas de maldade,","Ensinou-me um caminho a seguir","E com ele agora sou muito feliz."]},{"k":"v","l":["A deuses de madeira e de metal","Adorava com muita devoção,","Esperava sua fiel contestação,","Que tristeza! Vivia na ilusão.","De repente escutei uma doce voz e me disse:","Não ofendas mais a Deus, vem comigo,","Te vou ensinar ao Deus vivo que deves adorar."]},{"k":"v","l":["O mundo não o pode aceitar,","Pois a obra não chegou ao coração,","E rejeitam a palavra de verdade","Que um Apóstolo nos veio ensinar.","Por graça este povo o aceitou","E cremos que o Apóstolo é de Deus,","Já não ignora o caminho da verdade","Sua palavra nos trouxe a liberdade."]}]},{"n":311,"x":false,"t":"A GLÓRIA DE CRISTO","r":"Sal.29:2 CONFIANÇA · Sal. 103:4 GRATIDÃO","b":[{"k":"v","l":["A gloria de Cristo o Senhor cantarei,","Pois enche minha vida de gozo e paz;","Calar os favores que dele alcancei,","Meus lábios não podem jamais."]},{"k":"c","l":["É tudo bondade pra mim,","Com Ele não desejo mais,","Pois todos os meus desejos aqui,","Somente Ele pode encher."]},{"k":"v","l":["Em horas de angústia comigo Ele está,","E posso ouvir sua belíssima voz,","Me fala e sua paz inefável me dá,","A paz infinita de Deus."]},{"k":"v","l":["Se a cruéis conflitos me vê que eu vou,","Me deixa até o fim sozinho lutar;","Mas quando Ele vê que cedendo estou,","Socorro me vem emprestar."]},{"k":"v","l":["Também quando gozo o vejo chegar,","Então minha benção a aumenta o Senhor;","Enche meu copo e vejo transbordar,","Com todos seus dons de amor."]}]},{"n":320,"x":false,"t":"A VICTÓRIA E DE CRISTO","r":"LDM José Osório Garcia · AP.12:14 RESTAURAÇÃO · Prov.4:18","b":[{"k":"v","l":["A Victória é de Cristo,","No povo do Senhor,","Vá vencendo ao inimigo,","Por Jesus Cristo o Senhor,","E contente e muito alegre,","Hoje bendiz a seu criador."]},{"k":"c","l":["Como a aurora que vai nascendo,","Assim é a igreja do nosso Deus;","// De graça em graça está crescendo, Até chegar a","perfeição//"]},{"k":"v","l":["Muitas são as concubinas,","Que estão cuidando o amor;","Uma é a pomba minha,","Disse o sábio Salomão.","E esta é a igreja de Cristo,","Que o aguarda com amor."]},{"k":"v","l":["Esta é a igreja de Cristo,","Que no deserto existiu,","Por um tempo e outro tempo,","Mas hoje apareceu,","Cheia de gozo e confiança,","Hoje canta a seu criador."]},{"k":"v","l":["Toda tu és formosa, ó, amiga do Senhor,","Adornada estás de gala,","Esperando a teu senhor.","Como horta e como cana,","Aromático és tu."]}]},{"n":322,"x":false,"t":"A VIDA É FLOR QUE AMANHECE","r":"(SEMPRE TE AMAREI) LLDM MIGUEL A HUERTA CONSAGRAÇÃO SL 66:13","b":[{"k":"v","l":["GRATIDÃO","A vida é flor que na manhã aparece,","E ao cair da tarde alcança perecer,","Mas nosso ser em ti Senhor rejuvenesce,","E tem graça para sempre em ti viver."]},{"k":"c","l":["Se vivo estou o devo a ti por esta vida,","Teu é meu ser, meu coração,","Meu respirar, enquanto me prestas a vida,","É minha promessa,","Sobre as coisas todas sempre eu te amarei."]},{"k":"v","l":["Ensina-me a contar os dias de tal maneira","Que traga assim sabedoria ao coração,","Que ao terminar meu caminhar por esta vida,","Possa dizer: venci a luta, guardei a fé."]},{"k":"v","l":["Voto de amor, por teu perdão,","Venho te oferecer, sobre as coisas todas,","Sempre te amarei,","Não importa que não possam outros me entender,","Se sei que Tu vives em mim e eu em Ti"]}]},{"n":323,"x":false,"t":"A VIDA QUE TENHO","r":"1 P. 2:24 INTERCESSÃO · Sal.119:117 SÚPLICA","b":[{"k":"v","l":["A vida que tenho, só a devo a Jesus meu Senhor,","Ele me guarda em seu santo amor","E me salvou com sua grande dor."]},{"k":"c","l":["Senhor, não me soltes da tua mão,","Lembre-se de mim no meu lutar;","Segura-me por Jesus, teu filho amado,","Para que possa em tua doutrina caminhar."]},{"k":"v","l":["Ofensas e insultos, todo por mim padeceu o Senhor ,","Todo por dar-nos um viver melhor;","E assim mostrando seu bendito amor."]},{"k":"v","l":["Desprezos, blasfêmias, levou por mim o bendito Jesus,","E assim numa dura cruz;","Sofreu por dar-nos verdade e luz."]}]},{"n":324,"x":false,"t":"DEU LHE JESUS A MINHA VIDA","r":"RO 14:7 CONSAGRAÇÃO · AP 2:19 MISSIONÁRIOS","b":[{"k":"v","l":["Deu Jesus a minha vida,","Uma esperança que mudou todo o meu ser;","Salvou Minh ’alma por sua graça bendita,","Me escolheu para que cumpra seu quer"]},{"k":"c","l":["Nada mais nobre, nada mais digno","Que consagrar a Jesus Cristo nossa vida;","Penas e espinhos no seu caminho,","Os santifica sua presença bendita."]},{"k":"v","l":["Compreendo sim, o que custa,","Seguir os passos de Jesus no seu labor;","Mas o que importa seguirei com a fronte em alto","E por sua graça serei mais que vencedor."]},{"k":"v","l":["Minha vida inteira não paga,","O que o teu amor no calvário fez por mim;","Por isso mesmo ao teu serviço está rendida,","Como uma oferta consagrada só a ti."]},{"k":"v","l":["Minha vida inteira consagro,","Ao teu serviço, meu precioso Salvador;","Logo minha fronte luzirá de glória um Lauro,","Por cada alma que resgate por teu amor."]}]},{"n":325,"x":false,"t":"LIVRO SANTO","r":"2P.1:20 BÍBLIA","b":[{"k":"v","l":["Livro santo por Deus inspirado,","Manancial de verdades eternas;","Vieste para quebrar as correntes,","Do pecado, ignorância e temor.","Tu nos falas de régias mansões,","De um destino feliz mais além;","Manifesto à vista nos põe,","O que ao santo , seu Deus lhe dará."]},{"k":"v","l":["É perfeito o mandato divino,","Retamente encaminha as almas;","Ao pequeno a quem Tu tanto amas,","Tuas ordens os fazem crescer.","Paz e gozo perfeito lhe deste,","Ao mortal que em tuas fontes bebeu;","Galardão imortal conseguiste,","A quem fiel seus mandatos guardou."]},{"k":"v","l":["Segue sempre brilhando no mundo,","Que milhares tua luz desconhecem;","E que ao fim, da tua influência se alegrem,","No mundo te farei circular.","Deus bendito limpa minha mente,","Para ver tua perfeita verdade;","Faz a guarde, por sempre obediente,","Louvando tua bela bondade."]}]},{"n":328,"x":false,"t":"LOUVOR A TI MEU DEUS","r":"SL 91:1 INTERCESSÃO · SL 17:8 SÚPLICA","b":[{"k":"v","l":["Louvor a ti meu Deus, nesta noite,","Por todas tuas bondades deste dia;","ó guarda-me, e que suas potentes asas","Sejam por sempre a defesa minha."]},{"k":"c","l":["De quantas faltas hoje hei cometido,","Perdoa-me, meu Deus, por teu filho amado;","Contigo, com o próximo e comigo,","Que antes de dormir seja reconciliado."]},{"k":"v","l":["Ensina-me a viver que não me espante,","A tumba mais que o leito do repouso;","Ensina-me a morrer para que possa,","No dia do juízo, despertar glorioso"]},{"k":"v","l":["ó, possa repousar em ti minha alma,","Minhas pálpebras as feche um doce sono;","Um sono que vigor possa me prestar,","Para te servir ao despertar meu dono"]}]},{"n":330,"x":false,"t":"LOUVORES DAI A CRISTO O REI","r":"AP. 7:12 LOUVORES","b":[{"k":"v","l":["Louvores daí a Cristo o Rei, excelso e soberano,","E proclamai seu amor e lei, a todos ser humano;","Vibrantes notas arrancai , de vossas almas entonai,","Em doce tom celestial.","//// Louvor //// a Cristo o Rei."]},{"k":"c","l":["// Honra e glória a Cristo o rei//","Glória, louvores e majestades, Onipotência, benignidade","ao eterno Rei,","// Honra e glória a Cristo o rei//","Rei de reis imortal, louvor a Cristo o Rei."]},{"k":"v","l":["Louvores daí a Cristo o Rei em fervorosos cantos","E regerá de mar a mar, do mundo as nações;","E do seu trono, em redor, alegres almas com amor,","Em som triunfante cantarão","//// Louvor//// a Cristo o Rei."]},{"k":"v","l":["Louvores daí a Cristo o rei, Senhor ressuscitado,","Que ao inimigo forte e cruel, triunfante a derrotado;","E as legiões de Satã, venceu-as nosso capitão,","Cantem os céus, terra e mar.","//// Louvor//// a Cristo o Rei."]}]},{"n":334,"x":false,"t":"AS CRIANÇAS SÃO DE CRISTO","r":"Mr. 9:36 CRIANÇAS","b":[{"k":"v","l":["As crianças são de Cristo, Ele é seu Salvador,","São joias mui preciosas, compradas com seu amor."]},{"k":"c","l":["//// joias //// do Salvador,","Estão nesta terra, qual luz e doce amor."]},{"k":"v","l":["As crianças são tesouros, pois do céu são;","Luz refulgentes espalham em horas de aflição."]},{"k":"v","l":["As crianças são estrelas de grata claridade,","Querer Jesus que anunciem ao mundo sua verdade."]},{"k":"v","l":["As crianças são de Cristo, por elas Ele virá,","Com Ele para sempre, felizes vão viver"]}]},{"n":336,"x":false,"t":"OS SÉCULOS PASSARAM","r":"LDM Praxedes Alonso. · Sal. 5:1 ELEIÇÃO · 1 Co. 15:53 GRAÇA","b":[{"k":"v","l":["Os séculos passaram, porem se cumpriu,","A árvore de vida pronto floresceu;","O Deus que no horto a árvore tirou,","Tão só uma vara, tão só um sarmento,","Jeová em seu tronco, virtude lhe deu."]},{"k":"c","l":["Marcada foi essa virtude,","que morto o homem fosse imortal;","Vara de Arão que o Deus de amor,","em nossa pátria, já floresceu."]},{"k":"v","l":["Ouvi quando disse o Deus de bondade,","A alma que eu quero não podem tirar,","Por muito que rujam os ventos do mau","Eu venci ao mundo, o mundo não pode","Quando da minha mão, as almas tirar."]},{"k":"v","l":["Vem alma que geme, deixa tua dor,","Que grandes virtudes, maravilhas são;","Que lá nas alturas, onde está o Senhor,","Deu-lhe virtudes, derramou seus dons;","Toda potestade a seu filho deu."]},{"k":"v","l":["A vara da árvore desceu a Emanuel,","Também ao ungido do novo Israel;","A data marcada, memorável é ,","Os tempos passaram, que de nossos pais,","A vara de Arão entregada foi."]}]},{"n":338,"x":false,"t":"LUTA FIEL PELA OBRA","r":"Ro. 6:13 EXORTAÇÃO · 1 JN. 1:9 CONGREGAÇÃO","b":[{"k":"v","l":["Luta fiel pela obra de Cristo,","Não permitas mais o pecado em ti;","Considera o trabalho de Cristo,","Examina-te bem para seguir."]},{"k":"c","l":["Hoje tempo que tens que limpar-te,","Todo o coração e também teu ser;","Para estar na presença do Senhor,","Esperando em pé tua redenção."]},{"k":"v","l":["O batismo que tu recebeste,","Foi no nome de Jesus Cristo o Rei,","Perdoados foram teus pecados,","Porque foste obediente ao Salvador."]},{"k":"v","l":["Jesus Cristo está te chamando,","Escuta sua voz é teu salvador;","Pra te dar descanso a tua alma,","E tirar-te de toda perdição."]},{"k":"v","l":["Não durma irmão querido,","Vigia fiel por ti, com paciência e fé;","Não desprezeis a voz que te chama,","Com constância ao trono celestial."]}]},{"n":340,"x":false,"t":"LUTEMOS COMO OS FIEIS","r":"Mr. 8:35 LUTA · Mt. 10:39 EXORTAÇÃO","b":[{"k":"v","l":["Lutemos como os fiéis servos de Deus,","Defendendo a causa do Senhor,","Porque o Senhor Jesus a nosso lado vai,","Lutemos por Ele, ó povo de Israel,","Que a Vitória, Ele nos dará."]},{"k":"c","l":["Quem perder sua vida aqui,","Lá com Cristo a encontrará;","Quem morrer lutando assim,","Já por Jesus Cristo ressuscitará"]},{"k":"v","l":["Qualquer que como fiel soldado, lute,","Por defender a batalha da fé,","Deve vestir-se bem de justiça e poder,","E o triunfo terá por Cristo o Salvador,","Por sua potência tem que vencer."]},{"k":"v","l":["Não temas porque conosco vai o Senhor,","A fortaleza conosco está;","Ele o capitão, também nosso guiador,","Lutemos por Ele, oh, povo do Senhor;","Que a vitória Ele nos dará."]}]},{"n":342,"x":false,"t":"ENCHE MEU CORAÇÃO","r":"Ro. 15:13 AVIVAMENTO · Hch. 2:28 GOZO","b":[{"k":"v","l":["Enche meu coração da tua presença, ó Senhor,","Dai-me mais gozo, paz, contento e alegria,","Que sinta minha alma, tua Santa benção."]},{"k":"c","l":["// Dai-me mais gozo, alegria e também paz,","Que sinta minha alma, que tu comigo estás //"]},{"k":"v","l":["Sinto que teu poder me tira toda aflição;","Por isso peço que enches a minha alma,","Daquele formoso fogo do consolador."]},{"k":"v","l":["Enche todo meu ser da tua presença, ó Senhor;","Quero sentir que tu vens para minha alma,","E cheia de alegria te dê todo louvor."]}]},{"n":345,"x":false,"t":"MESTRE SE AGITAM","r":"LC. 8:24 INTERSEÇÃO · MT. 8:26 CONFIANÇA","b":[{"k":"v","l":["E ruge a tempestade;","Os grandes abismos do céu,","Se cobrem de escuridão.","Não vês, que aqui perecemos?","Podes dormir assim Quando o mar agitado nos abre,","Profundo sepulcro aqui?"]},{"k":"c","l":["Os ventos, as ondas ouvirão Tua voz,// Seja a paz// calmas as fúrias do negro mar,","As lutas da alma as faz cessar,","E assim o barco onde vai o Senhor,","Afundar-se não pode no mar traidor,","Onde quer se cumpre Tua vontade, // seja a paz//Tua voz ressoa na imensidão: seja a paz."]},{"k":"v","l":["Mestre meu ser angustiado Te busca com ansiedade;","Da minha alma nos antros profundos,","Se livra cruel tempestade.","Passa o pecado a torrentes,","Sobre meu frágil ser;","E //pereço// mestre,","Oh, quer-me socorrer!"]},{"k":"v","l":["Mestre passou a tormenta,","Os ventos não rugem já;","E sobre o cristal das águas,","O sol resplandecerá.","Mestre prolonga esta calma,","Não me abandone mais;","Cruzarei os abismos contigo,","Gozando bendita paz."]}]},{"n":346,"x":false,"t":"MARCHA COM GOZO","r":"ALDM LUZ SANDOVAL · Êx 14:15 SANTA CEIA · 1 Pe 2:9 RESTAURAÇÃO","b":[{"k":"v","l":["Marcha com gozo, ó povo do Senhor,","Com louvores e glórias ao Criador;","Olha a Cristo que humilde nos convida,","Que te alegres no banquete de amor."]},{"k":"c","l":["Este é o povo que Deus tem escolhido,","Estava espalhado pelo mundo e o erro;","Agora, Cristo, por piedade, o recolheu,","Venha recrear-se no banquete de amor."]},{"k":"v","l":["Se quiseres vir a Jesus Cristo,","Deixa este mundo e toda sua ilusão;","Venha logo aos pés de Jesus Cristo,","Goza alegria e também de seu perdão."]},{"k":"v","l":["Todos os santos que gozam esta benção,","Deixaram tudo pra seguir a seu Senhor:","Este banquete é lembrança da sua morte,","E uma memória de sua bendita paixão."]}]},{"n":353,"x":false,"t":"MEDITAI, OH POVOS","r":"EC. 12:7 CHAMAMENTO · Sal. 103:15 DORMEM","b":[{"k":"v","l":["Meditai, ó povos todos,","Medita, ó mundo inteiro,","Do pó fostes tomado","E em pó te tornarás;","Assim disse o criador."]},{"k":"c","l":["Mas quem crer em Jesus,","Em memória de Deus estará,","E uma vida eterna gozará,","Quando cheguemos a Sião.","Um hino novo entoaremos,","Ante o trono do supremo rei;","E o Senhor meus passos guiará,","Quando cheguemos a Sião."]},{"k":"v","l":["Como a erva do campo,","Que floresce na manhã,","Mas quando chega à tarde,","Sua beleza se apaga,","E tudo desaparece."]},{"k":"v","l":["Nossos dias são bem curtos,","Que se passam como um sonho,","Nossa vida é uma história,","Cheia de dissabores,","De tristeza e dores."]}]},{"n":354,"x":false,"t":"ME FERIU O PECADO","r":"Ro.66 PAIXÃO · JN.14:16 GRAÇA","b":[{"k":"v","l":["Me feriu o pecado, fui a Jesus,","mostre-lhe minha dor;","Perdido, errante, vi sua luz,","Abençoou-me seu amor."]},{"k":"c","l":["// Na cruz // primeiro eu vi a luz,","E as manchas da minha alma eu lavei;","Foi ali, pela fé, eu vi a Jesus,","E sempre feliz com Ele serei."]},{"k":"v","l":["Sobre uma cruz, meu bom Senhor,","Seu sangue derramou","Por este pobre pecador,","A quem assim salvou."]},{"k":"v","l":["Venceu a morte com poder,","E ao céu se elevou;","Confiar nele é meu prazer,","Morrer não temo eu."]},{"k":"v","l":["Mesmo que se foi, só não estou,","Mandou ao consolador;","Divino espirito, que hoje,","Me dá perfeito amor."]}]},{"n":361,"x":false,"t":"ENQUANTO VIVA NESTE MUNDO","r":"Jn.16.33 INTERSEÇÃO","b":[{"k":"v","l":["Enquanto viva neste mundo,","Inimigos onde quer eu terei;","Ao Senhor estou pedindo:","Na luta, aumenta-me a fé ."]},{"k":"c","l":["Senhor aumenta-me a fé, sim, aumenta-me a fé,","E qualquer inimigo vencerei;","Senhor aumenta-me a fé, sim, aumenta-me a fé,","Oh meu Deus, Tu podes fazer!"]},{"k":"v","l":["Este mundo não me quer,","Isso não me pode desanimar;","O Senhor o tem vencido,","E sua graça me dá para triunfar."]},{"k":"v","l":["Satanás nosso inimigo,","A Jesus Cristo se aproximou;","se chegar a mim, eu o sigo","O caminho que Cristo nos marcou."]},{"k":"v","l":["Inimigos poderosos,","Nossa ruína procuram sem parar;","O Senhor diz: não temas,","Eu contigo por sempre vou estar."]}]},{"n":365,"x":false,"t":"MEU PAI É UM REI","r":"Ro. 10:12 GRAÇA","b":[{"k":"v","l":["Meu Pai é um Rei, muito rico e sem-par,","Tem imensos torrentes por todo lugar;","Seu ouro e diamantes não posso contar,","Ninguém seus tesouros poderá conter."]},{"k":"c","l":["// Sou o filho de um Rei,","O filho de um Rei;","Com Cristo bendito,","Sou o filho de um Rei //"]},{"k":"v","l":["O filho de Deus, meu bom Salvador,","Vindo ao mundo, mui pobre viveu,","Hoje reina na glória, cheio de louvor,","E um lar nos céus com Deus me ofereceu."]},{"k":"v","l":["Errante vivi, sem pátria nem lar,","Um vil estrangeiro sem Deus e sem fé;","Mas Cristo bendito me quis adotar,","Coroa e mansão nos céu terei."]},{"k":"v","l":["Não importa que eu, não tenha nem lar,","Eu tenho um palácio, do sol mais além;","Enquanto chego, eu posso cantar,","Sou o filho de um Rei, aleluia a Jesus."]}]},{"n":372,"x":false,"t":"MEU SENHOR E REI MUI RICO É","r":"Mt. 25:14 OBREIROS · 1 Tim. 4:16 EXORTAÇÃO","b":[{"k":"v","l":["Meu Senhor e rei mui rico é,","Se foi daqui e um talento me deixou;","Me deixou dito que vai voltar,","Que não seja preguiçoso, que trabalhe por Ele."]},{"k":"c","l":["Bendiz, Oh Senhor o talento que me deste,","// E multiplica-o //","Que seja teu nome santificado;","E que cresça em mim a fé."]},{"k":"v","l":["Que gozo tenho porque o recebi,","O recebi quando me batizei;","Também me diz que minhas culpas levou,","E que com seu sangue minha alma resgatou."]},{"k":"v","l":["Agora sou livre para trabalhar,","Com o talento que Cristo me deixou;","Edificando na casa espiritual,","Meu gozo é seu nome exaltar."]},{"k":"v","l":["Unidos a meus irmãos eu sempre estarei,","Pois somos a família do Autor da fé;","Usando o talento que Cristo me deixou,","Quando Cristo venha, encontre nas almas fé."]}]},{"n":375,"x":false,"t":"MINHA VIDA FOI TÃO CRUEL","r":"Ef.2.1 GRATIDÃO · Judas 1:21 PERSEVERANÇA","b":[{"k":"v","l":["Minha vida foi tão cruel em neste mundo,","Perdida Minh´ alma sempre se encontrou;","Mas o amor de Cristo, que é profundo,","Daquele perigo imenso me tirou."]},{"k":"c","l":["Com gratidão glorifico seu nome,","Manifestando ao mundo seu poder;","Não há amor mais imenso no mundo,","Como o amor de Cristo, meu Rei."]},{"k":"v","l":["A vida eterna Cristo me promete,","Se eu persistir sempre em santidade;","Obedecendo em tudo sua palavra,","A vida eterna sempre me dará."]},{"k":"v","l":["Feliz o dia e tão memorável,","Que resgatado fui da maldade;","Por meus pecados Ele sofreu a morte,","Para ensinar-me a fazer sua vontade."]}]},{"n":376,"x":false,"t":"MINHA VIDA NÃO TE PAGA","r":"Ro.5:8 AMOR · Col. 3:15 GRATIDÃO","b":[{"k":"v","l":["Minha vida não te paga minha Santa salvação,","Me achaste no mundo, bem longe, na perdição;","É a Cristo quem eu Amo!"]},{"k":"c","l":["Hoje marcho com amor por toda sua bondade,","Eu sigo a Cristo até ver onde está!"]},{"k":"v","l":["Você sabe o que sinto por toda minha maldade,","Fui causa de tua morte para livrar-me de condenação;","!É a Cristo quem eu amo!"]},{"k":"v","l":["Um pranto é o que sinto de gozo e gratidão,","Que nada merecendo, minha alma bebe de teu doce amor;","!É a Cristo quem eu amo!"]},{"k":"v","l":["Um anjo, Deus de amor, esteja ao redor","Da alma peregrina para livrá-la de condenação;","!E viver ali com Deus!"]}]},{"n":378,"x":false,"t":"MUITAS SÃO MINHAS FALTAS","r":"LDM Rosálio Rodriguez · Sal. 51:12 CONSAGRAÇÃO · 2 COR. 7:1 SÚPLICA","b":[{"k":"v","l":["Muitas são minhas faltas, oh Senhor,","Perdoa já toda minha maldade;","Guia-me em tua senda, por teu amor,","Para caminhar em santidade.","Firme e adiante seguirei,","Tomando a cruz em pós de Ti;","Grande foi minha dívida, Jesus,","Que na cruz pagaste Tu por mim."]},{"k":"c","l":["Limpa, Oh Senhor, meu coração,","livra-me de toda minha maldade;","Só quero ser te fiel, meu Deus,","Te seguirei, em verdade fiel a Ti serei."]},{"k":"v","l":["Tristeza e miséria é o viver,","Sem amor de Deus, nem caridade;","Enche, Tu Senhor, meu coração,","De esse amor tão grande e santidade.","Se por teu amor eu sofrerei,","E Minh ‘alma a fatiga o padecer,","Sei que seu amor me sustentará,","Se em teu caminho eu for fiel."]},{"k":"v","l":["Lembro que a teus pés eu jurei,","Deixar todo o vício e vaidade;","E se tu me ajudas cumprirei,","Guarda, tu Minh’ alma em santidade.","Ante ti me prostro, meu Jesus ,","A implorar de Ti, Senhor, perdão;","Guia meu caminho com tua luz,","A Minh´ alma dá a salvação."]}]},{"n":380,"x":false,"t":"NADA NESTE MUNDO SATISFAZ","r":"JN. 6;48 CONFIANÇA · JN. 15:13 AMIZADE","b":[{"k":"v","l":["Nada neste mundo satisfaz,","Como Cristo, meu bom Salvador;","Nada dá a meu coração descanso,","Somente seu precioso amor.","E se todo o mundo fosse meu,","Não teria para mim valor;","Porque o gozo mundano não enche,","Não dá paz, como Cristo ,o Senhor."]},{"k":"v","l":["Se tivesse eu riquezas grandes,","Muita fama, glória e grande honra;","Mas se não tivesse a esperança,","De outra vida muito mais melhor.","Se tivesse tudo, menos Cristo,","E seu amor que me levou a cruz,","Oh, por onde aqui em este mundo,","Acharia eu a paz e luz?"]},{"k":"v","l":["Oh que falso é tudo neste mundo,","Sem Jesus não há nada de valor;","Sem Jesus não há gozo e vida eterna,","Mas eterna noite e grande dor.","Se pudesse eu viver sem Cristo,","Que terror morrer na maldade!;","Sem Jesus em sombra da morte,","Sem Jesus por toda eternidade."]},{"k":"v","l":["Oh, que gozo e bênção me dá Cristo,","Ele cura-me de todo dor;","Todos meus pecados me perdoa,","Me coroa com seu favor.","Se eu tenho a Cristo e só a Cristo,","E em todo o mundo nada mais,","Todos meus desejos Ele cumpre,","É em glória eu lhe verei."]}]},{"n":381,"x":false,"t":"NADA SEI SOBRE O FUTURO","r":"Ira Stanphill · PROV. 17:17 CONFIANÇA","b":[{"k":"v","l":["Nada sei sobre o futuro, desconheço o que haverá","É provável que as nuvens, minha luz venha a cobrir;","Nada temo do futuro, pois Jesus comigo está","Eu o sigo decidido, Ele sabe o que haverá."]},{"k":"c","l":["Muitas coisas não compreendo, do Amanhã com sua","presa","Mas um meigo amigo eu tenho, minha mão sustentará."]},{"k":"v","l":["Meu caminho é mais brilhante quando gozo seu amor","Mais leves são minhas cargas, quando vou com meu","Senhor, Quando chegue às mansões que na glória","preparou Não terei já mais temores, decepções, nem dor."]},{"k":"v","l":["Nada sei sobre o futuro, desconheço o que haverá","Mas se cuida das aves, também me vai a cuidar,","E ao andar por meu caminho, na prova ou tempestade","Sei que Cristo irá comigo, sei que guarda sua bondade."]}]},{"n":382,"x":false,"t":"NECESSIDADE TEMOS DE CRISTO","r":"Sal.42:2 INTERCESSÃO · 2 SAM.14:14 SÚPLICA","b":[{"k":"v","l":["Necessidade temos de Cristo, o Salvador,","Por que nEle temos a paz e o amor;","Por sempre seja bendito, Jesus meu Redentor."]},{"k":"c","l":["Cristo, todas as almas têm necessidade de Ti,","Porque tu as sustentas e são salvas por Ti."]},{"k":"v","l":["Como terra sedenta, como grande deserto","Assim se te apresentam as almas mais e mais,","Pois tu as alimentas com teu grande poder."]},{"k":"v","l":["A Ti,","Criador dos céus, a Ti,","Rei celestial,","Pedimos o consolo,","Maná espiritual;","Tu cuidas de teus servos, tua benção lhe das."]}]},{"n":387,"x":false,"t":"NOITE DE PAZ","r":"Joseph Mohr e Franz Gruber · MEDITAÇÃO","b":[{"k":"v","l":["Noite de paz, noite de amor","Goza o povo do Senhor,","Cantando glórias ao Salvador","Por sus bondades que dele recebeu,","// Digno é o grande redentor//"]},{"k":"v","l":["Noite de paz, noite de amor","Vê que Santa comunhão","Há na igreja do bom salvador","Graça e glória em plenitude,","// Por nosso bom redentor//"]},{"k":"v","l":["Noite de paz, noite de amor","Vê que gozo no Senhor","Há na igreja de Cristo Jesus","E resplandece no mundo sua luz","// Resplandecente no seu amor//"]}]},{"n":393,"x":false,"t":"NÃO TENHO CUIDADOS","r":"Sal.23:4 CONFIANÇA","b":[{"k":"v","l":["Não tenho cuidados nem tenho temor,","Do que me espera aqui,","Confio somente em meu bom Salvador,","O qual cuida sempre de mim."]},{"k":"c","l":["Vivo por fé em meu Salvador,","Não temerei, é fiel meu Senhor;","Em toda luta nunca me deixará,","Eu vivo por fé, Ele me cuidará."]},{"k":"v","l":["Virão tempestades eu sei muito bem,","A força do sol faltará;","Amigos deixar-me o podem também,","Jesus sempre me sustentar."]},{"k":"v","l":["O Deus que ainda veste o lírio aqui,","Sustenta também ao pardal,","Jamais pode abandonar-me a mim,","Seu filho sou por sua adoção."]},{"k":"v","l":["Um dia virá outra vez o Senhor,","Ao céu Ele nos levará;","Ali acabará todo afã e temor,","E Deus tudo dominará."]}]},{"n":395,"x":false,"t":"NUNCA DESMAIE","r":"2 Co 4:16 CONFIANÇA · Jó 17:3 GRAÇA","b":[{"k":"v","l":["Nunca desmaie em tua aflição","Deus cuidará de ti;","baixo suas assas de proteção,","Deus cuidará de ti."]},{"k":"c","l":["Deus cuidará de ti,","Com terno amor consolador;","// Deus cuidará de ti//"]},{"k":"v","l":["Em tuas pressas e tua dor,","Deus cuidará de ti;","Em luta cruel com o tentador,","Deus cuidará de ti."]},{"k":"v","l":["Nada na vida te faltará,","Deus cuidará de ti;","Sempre sua graça te bastará,","Deus cuidará de ti."]},{"k":"v","l":["Em horas negras de adversidade,","Deus cuidará de ti;","Põe tua confiança em sua bondade,","Deus cuidará de ti."]}]},{"n":397,"x":false,"t":"OH CANTA PARA MIM OUTRA VEZ","r":"Jn. 6:68 BÍBLIA · Hebreus 2:12 LOUVOR","b":[{"k":"v","l":["Oh canta pra mim outra vez: belas palavras de vida,","Acho nelas meu gozo e luz, belas palavras de vida;","Sim, de luz e vida, são sustento e guia,","/// Que belas são// belas palavras de vida//"]},{"k":"v","l":["Jesus Cristo a todos dá: belas palavras de vida,","Hoje escuta-as pecador: belas palavras de vida;","Bondoso te salva e ao céu te chama,","/// Que belas são// belas palavras de vida//"]},{"k":"v","l":["Grato cântico soará: belas palavras de vida,","Teus pecados perdoará: belas palavras de vida;","Sim, de luz e vida, são sustento e guia,","/// Que belas são// belas palavras de vida//"]}]},{"n":398,"x":false,"t":"OH, CRISTO AMADO","r":"1 JN. 4:10 AMOR · Apoc.7:14 ESPERANÇA","b":[{"k":"v","l":["Oh, Cristo amado bendito Salvador,","Por Ti eu deixei a senda do erro;","Eu quero servir-te pois Tu me amaste,","/// Se antes não te amava/// Senhor, agora sim."]},{"k":"c","l":["E ao chegar no céu assim eu cantarei,","///Eu era vil e indigno/// mas Cristo me salvou."]},{"k":"v","l":["Te amo, Jesus porque em teu infinito amor,","Tiveste desprezo, vergonha e dor;","Coroa de espinhos levaste tu por mim,","/// Se antes não te amava// Senhor agora sim."]},{"k":"v","l":["Em vida ou em morte eu sempre te amarei,","E com louvores minha voz entoarei;","Porque num madeiro morreste tu por mim,","/// Se antes não te amava/// Senhor agora sim."]},{"k":"v","l":["Em santa morada de gozo eternal,","A Cristo Jesus o Cordeiro imortal;","Por sempre cantarei: oh, que gozo para mim,","/// Se antes não te amava/// Senhor agora sim.","399. ОН, CRISTO MEU","Sl 70:4 CONSAGRAÇÃO / Sl 16:17 MEDITAÇÃO","Oh, Cristo meu, Tu és amigo fiel,","Seguro amparo, só em ti terei;","Nas minhas aflições, bom Jesus irei a ti,","E Consolo e benção, me darás, oh sim","REFRÄO","Cristo, vem mais perto, paz perfeita em minha alma põe;","Perto, sim, mais perto, do meu coração."]},{"k":"v","l":["Quando na noite, eu veja estrelas mil,","Tua voz formosa, minha almh´ possa ouvir;","Faça que eu medite, no teu terno e doce amor,","E que eu te louve, cheio de fervor."]},{"k":"v","l":["Quando esta vida, eu tiver que abandonar,","Coroa formosa, tu me darás;","E com doce cântico louvarei a tua bondade,","E em mansão de glória sempre morarei"]}]},{"n":402,"x":false,"t":"OH QUÃO PRECIOSO E ADORAR","r":"MI 4:2 LOUVOR · 1 Ts 4:16 VOLTA DE JESUS CRISTO","b":[{"k":"v","l":["Oh quão precioso é adorar a Jesus Cristo,","E meditar na palavra do Senhor,","Esperando com paciência sua vinda,","Para nossa eterna consolação."]},{"k":"c","l":["//E o mais precioso é voar ao céu,","Chegar com Cristo e dar-lhe louvor//"]},{"k":"v","l":["Oh quão grandiosa é a reunião dos irmãos,","Que se batizam no nome de Jesus,","Esperando a promessa de seu Pai,","Que por Cristo nos teria que enviar."]},{"k":"v","l":["Naquele dia em que resplandeça a justiça,","Todos sairemos a ordenança do Senhor,","Saltando como bezerros de manada,","Dando glórias e aleluias ao Senhor."]},{"k":"v","l":["Olha aquelas multidões que são brancas,","Quem serão?, vêm com palmas nas mãos;","Estes passaram por grandes tribulações","E o sangue do Cordeiro os limpou."]}]},{"n":403,"x":false,"t":"OH QUÃO SANTA","r":"(UMA VIDA FELIZ) ALDM NEFTALI MEDINA F · COMUNHÃO","b":[{"k":"v","l":["Oh quão santa, é a união, dos santos em Sião,","Os que louvam a Deus sem cessar,","E adoram a Deus, com todo o coração,","Por que a Ele só é a adoração."]},{"k":"c","l":["//E viver para Ele, uma vida feliz, os que louvam a Deus","sem cessar//"]},{"k":"v","l":["Sem cessar quero estar louvando ao Senhor,","Ao cordeiro que vida nos deu,","E a seus pés quero estar escutando sua voz","Que me dá doce benção e bem-estar."]},{"k":"v","l":["Certamente aqui está Deus neste lugar,","Que é a porta do reino eternal,","Os que adoram a Deus, com unânime voz,","Na casa de Deus cantarão","2do REFRÃO","//Aleluia// Os que louvam a Deus sem cessar","// Aleluia// Os que louvam a Deus sem cessar","// Sem cessar //"]}]},{"n":408,"x":false,"t":"OH, JAMAIS NOS CANSAREMOS","r":"Sal.108:1 LOUVORES · Apoc. 14:3 ADVENVIMENTO","b":[{"k":"v","l":["Oh, jamais nós cantaremos da grande canção,","Louvores a Deus, aleluia!","Pela fé a cantaremos com o coração,","Louvores a Deus, aleluia!"]},{"k":"c","l":["Aos filhos do Senhor pertence o cantar,","Pois virá o Salvador e nos arrebatará,","Do palácio celestial, gozarmos muito mais,","Louvores a Deus, aleluia!"]},{"k":"v","l":["Ó, a indizível glória do divino amor,","Louvores a Deus, aleluia!","Nas suas asas leva a alma com o Salvador,","Louvores a Deus, aleluia!"]},{"k":"v","l":["que formosos são os anjos morando em luz,","Louvores a Deus, aleluia!","Mais brilhantes os crentes ao chegar Jesus,","Louvores a Deus, aleluia!"]},{"k":"v","l":["Coroados na glória, com o Salvador,","Louvores a Deus, aleluia!","Cantaremos louvores do divino amor,","Louvores a Deus, aleluia!"]}]},{"n":417,"x":false,"t":"OH, QUE FELICIDADE","r":"Ro. 8:38 AMOR · Jn. 14:6 GOZO","b":[{"k":"v","l":["Oh, que felicidade senti Minh´ alma,","Porque hoje a minha fé se assenta na palavra;","Nem ventos, nem trovões podem tirá-la,","Porque o amor de Cristo mora em minha alma.","REFRÁO","Amor, santo amor, curou quebranto,","De minha alma que no mundo sofreu tanto;","Porém hoje, se sofro eu por aquele santo,","Terei a vida eterna se sou manso."]},{"k":"v","l":["O mensageiro aqui é como a água,","Saciando as secas pela palavra;","Dizendo de Cristo que nos salva,","Trazendo descanso para sua alma."]},{"k":"v","l":["Lugares que sem paz se encontravam,","Gemendo desta vida tão amarga,","Ainda que procuravam já deixa-la,","Mas o devorador tinha as almas."]},{"k":"v","l":["Já Cristo com poder tem ascendido,","Deixando derrotado o inimigo","Dizendo com amor: vem comigo!","Que eu sou a verdade e o caminho."]}]},{"n":419,"x":false,"t":"OH, SANTA IGREJA DE DEUS","r":"LDM Praxedis Alonso · Cnt. 4:12 RESTAURAÇÃO · Cnt 7:10 GOZO","b":[{"k":"v","l":["Oh santa igreja de Deus, esposa do Salvador,","Que liberta por Cristo, hoje lhe canta com amor;","Do oriente e ocidente, temos ouvido a tua voz.","são tuas granadas fazendas","Que abundam em dons para o pecador."]},{"k":"c","l":["Onde habita a graça de Cristo, que nos enviou o Deus de","Amor, É grande gozo ter esta benção, como o encanto","daquele rei Quando dançou."]},{"k":"v","l":["Fonte fechada és tu, fonte selada de Deus,","Deus te inundou de virtude, dentro de um novo Israel;","Rosa do vale de Saron, que estão plantadas em louvor,","Sou do meu amado e comigo sustenta","Seu gozo de consolação."]},{"k":"v","l":["Cantemos com expressão, cantemos com gratidão,","Dentro do átrio sagrado, estou doente de amor;","Venham do norte e do sul, venham ao monte de Gelead,","São teus renovos paraísos,","Refúgio de asilo ao vil pecador."]},{"k":"v","l":["Goza ,esposa de Deus, que já a tua luz chegou,","São mais os filhos que tens que a que ontem desposou;","Pois já os tempos passaram, a profecia se cumpriu,","É o ministério de Deus nos á enviado","Que a seuHinário","servo lhe revelou","A Luz Do Mundo"]}]},{"n":423,"x":false,"t":"OH, EU QUERO ANDAR","r":"1 P.2:21 CONSAGRAÇÃO · 1P. 1:16 GOZO","b":[{"k":"v","l":["Oh, eu quero andar Cristo, quero ouvir sua terna voz,","Meditar em sua palavra, sempre andar dele em pós;","Consagrar a Ele minha vida, cumprir fiel sua vontade,","E algum dia com meu Cristo, gozarei da claridade."]},{"k":"c","l":["Oh sim, eu quero andar com Cristo!","Oh sim, eu quero viver com Cristo!","Oh sim, eu quero morrer com Cristo!","Quero ser um testemunho fiel."]},{"k":"v","l":["Oh, eu quero andar com Cristo, Ele viveu em santidade,","Na bíblia eu o leio e sei que é a verdade;","Cristo era santo em tudo, o cordeiro da cruz,","E eu anseio ser cristão, seguidor do meu Jesus."]},{"k":"v","l":["Oh, eu quero andar com Cristo da minha senda Ele é a luz,","Deixar o perverso mundo e carregar aqui minha cruz;","Este mundo nada oferece, Cristo oferece salvação,","E é minha doce esperança, gozar vida eterna em Sião."]},{"k":"v","l":["Goza ,esposa de Deus, que já a tua luz chegou,","São mais os filhos que tens que a que ontem desposou;","Pois já os tempos passaram, a profecia se cumpriu,","É o ministério de Deus nos á enviado","Que a seu servo lhe revelou"]}]},{"n":430,"x":false,"t":"PAI A TEUS PÉS ME PROSTRO","r":"Ro.8.6 AVIVAMENTO · Rom. 8.26 SÚPLICA","b":[{"k":"v","l":["Pai, a teus pés me prostro,","Rompe minhas prisões duras;","Oh, responde enquanto chamo,","Põe teu espírito em mim."]},{"k":"c","l":["Põe teu espírito na minha alma,","Faz-me o que deveria;","Faz-me puro em tudo, livre do pecado,","Põe teu espírito em mim."]},{"k":"v","l":["Enquanto Cristo intercede,","Enquanto oro, eu humilde;","O que necessito, dá-me,","Põe teu espírito em mim."]},{"k":"v","l":["Não desejo ofender-te,","Viverei para agradar-te,","E em meu coração guardar-te,","Põe teu espírito em mim."]},{"k":"v","l":["Livra-me de ser órfão,","Não me deixes perecer;","Guarda-me em teu santo seio,","Põe teu espírito em mim."]}]},{"n":431,"x":false,"t":"PAI BENDITO VIEMOS A TI","r":"Mt. 21.21 GRATIDÃO · Sal. 68:3 GOZO","b":[{"k":"v","l":["Pai bendito viemos a Ti,","dando-te graças por ver nos aqui","Da tua presença queremos gozar,","Nunca nos deixes duvidar."]},{"k":"c","l":["/// Nunca/// nos deixes duvidar,","/// Sempre/// devemos orar."]},{"k":"v","l":["Com gratidão por teu dom de amor,","Hinos cantamos de grande louvor;","Em nossa vida tu podes brilhar,","Nunca nos deixes duvidar."]},{"k":"v","l":["Dons sem fim da mensagem de paz,","Tu com amor em Sião nos darás;","Teu sacerdócio poderemos ganhar,","Nunca nos deixes duvidar."]},{"k":"v","l":["Forças concede-nos hoje na luta,","Firmes, irmãos ao mal resistir;","Em sua presença poderemos morar,","Nunca nos deixes duvidar."]}]},{"n":434,"x":false,"t":"SE FOI MEU MESTRE","r":"LC. 19:12 OBREIROS · 2 Tim.2:6 PERSEVERANÇA","b":[{"k":"v","l":["Se foi meu Mestre a um país sem igual,","Que longe está,","Deixou-me mandatos e obedecer ao Senhor,","Meu dever será."]},{"k":"c","l":["Fiel quero ser, aguardando sua vinda,","Em seu serviço sempre constante e verás;","Fiel quero ser onde quer sua mão me leve,","Até que tenha o gozo de ver sua faz."]},{"k":"v","l":["Já brancas estão as regiões,","E obreiros bem poucos são;","Então com gozo, aceito meu lugar,","E minha porção."]},{"k":"v","l":["Poderão outros ir a vinha,","E logo eu, negligente ser?;","Usar seus talentos poderão os outros,","E o meu, eu esconder?"]},{"k":"v","l":["Se aproxima o momento da sua vinda,","Mas quando, eu não sei,","Somente anseio me encontre,","Sempre ativo, fervente e fiel."]}]},{"n":440,"x":false,"t":"PIEDADE OH SANTO DEUS","r":"Sal.51:1 salmos · sal.65:3 súplica","b":[{"k":"v","l":["Piedade, oh Santo Deus, piedade,","Piedade implora o coração;","Lava-me da minha maldade!","E dá-me gozo, paz, perdão."]},{"k":"v","l":["Minhas rebeliões graves são,","São todas só contra Ti;","Mas cria um novo coração,","E um novo espírito em mim."]},{"k":"v","l":["Não queres sacrifícios mais,","Que ao humilhado coração;","Minha oferta não desprezarás,","Já que Tu és todo compaixão."]},{"k":"v","l":["Salva-me, Deus com teu poder,","Que minha esperança é só em Ti;","Tremendo aguardo teu querer,","Tenha compaixão de mim."]}]},{"n":441,"x":false,"t":"PRAZER VERDADEIRO","r":"LDM Guillermo Miranda · 1 P.5:4 Obreiros · Mt. 11:30 CONFIANÇA","b":[{"k":"v","l":["Prazer verdadeiro é servir ao Senhor,","Não a obra mais nobre, nem pago melhor;","Servi-lhe eu quero, com fé e amor,","Servi-lhe, prometo desde hoje."]},{"k":"c","l":["Servir a Jesus, servi-lhe com fé,","Que pago tão rico terei;","Não importa que sofra, sofreu Ele por mim,","Servindo a Jesus sou feliz!"]},{"k":"v","l":["Direi a verdade, serei sempre fiel,","Não importa que tudo o perda por Ele;","Riquezas eternas em Cristo terei,","Desde hoje só a Ele servirei."]},{"k":"v","l":["O ódio do mundo por Ele sofrerei,","Pesada a carga com certeza será,","Mas sei que sua graça não me faltará,","A Cristo até o fim servirei.."]}]},{"n":442,"x":false,"t":"POR FÉ VOU ALCANÇAR","r":"LDM Guillermo Miranda · 1 P.5:4 Obreiros · Mt. 11:30 CONFIANÇA","b":[{"k":"v","l":["Por fé vou alcança a vida eterna,","As mais fortes tormentas vencerei,","Ao fim que meu Jesus tira minhas penas,","Por fé, seu rosto em glória olharei."]},{"k":"c","l":["Por fé, eu olharei, por fé esperarei;","Por fé, desfrutarei a vida eterna."]},{"k":"v","l":["Oh, doce esperança anima minha alma,","Viver nos braços do meigo Jesus;","Triunfante levarei coroa e palmas,","Morando em célica mansão de luz."]},{"k":"v","l":["Senhor, perdoa minhas debilidades,","Que saia vitorioso pela fé;","Que nunca volte as perversidades,","A glória da vida que deixei."]},{"k":"v","l":["Senhor, se acaso em mim a fé desmaia,","Senhor, te rogo aumenta-me a fé;","Que cruze o bravo mar, chegue a tua praia,","Sê sempre, meu Jesus, piloto fiel."]},{"k":"v","l":["Eu tenho a confiança em Jesus Cristo,","Que sou justificado pela fé;","Por fé eu olharei o que não vi,","Por graçaHinário","salvo sou e pela fé.","A Luz Do Mundo"]}]},{"n":443,"x":false,"t":"POR JESUS, LUTANDO","r":"Sal.27:1 CHAMAMENTO · Ef.6:12 LUTAR","b":[{"k":"v","l":["Por jesus , lutando até a morte,","Viverei constante a sua bandeira;","Mesmo que vil, traidora, seja a morte,","Não temerei jamais, confiando em Deus."]},{"k":"c","l":["Cristo é a só expiração,","Verdade que alivia o coração,","Luz que destrói escuridão,","A mais preciosa realidade.","Unido a Cristo pela fé,","Alegre sempre lhe direi,","Se tu me chamas, aqui estou,","Bendito Cristo, teu sou."]},{"k":"v","l":["Que minha vida inteira consagrada,","Por Jesus empregada sempre seja;","E seguindo a Cristo na jornada,","Não temerei jamais, confio em Deus."]},{"k":"v","l":["Vem a Cristo Ele está chamando,","Abandona todos teus pecados;","E em seu nome, sendo batizado,","Seu espírito Ele te dará"]}]},{"n":444,"x":false,"t":"PELA INEFÁVEL LUZ DO DIA","r":"2 Co.9:15 AMANHECER · Sal.54:6 LOUVORES","b":[{"k":"v","l":["Pela inefável luz do dia,","Que tanto alegra o coração,","Ao acordar- nos diariamente,","Quando admiramos o fulgor;","De uma alvorada clara e bela,","Graças sejam dadas ao meu Deus!"]},{"k":"v","l":["Pelo aroma das flores,","Em suas vestidos de cor","Vemos a mão onipotente,","Cujo pincel as matizou;","Por tantas, tantas maravilhas,","Graças sejam dadas ao meu Deus!"]},{"k":"v","l":["Por esse pão de cada dia,","Que nos concede, com amor,","Infatigável, bom e santo;","A todos ser da criação;","Por esse pão que nos dá vida,","Graças sejam dadas a meu Deus!"]},{"k":"v","l":["E pelo teto que nos cobre,","E por sua Santa benção;","E pela vida dos meus pais,","Que me acalmaram com amor;","Por tantas dádivas preciosas,","Graças sejam dadas a meu Deus!"]},{"k":"v","l":["Pela centelha milagrosa,","De inteligência que Ele nos deu,","Para pensar no infinito,","Com essas belas de amor;","Pole sublime privilégio,","Graças sejam dadas a meu Deus!"]},{"k":"v","l":["Por essa benção tão insigne,","Que sua piedade nos concedeu,","Mandando a seu filho sacrossanto,","A consumar a redenção,","Dos humanos pecadores,","Graças sejam dadas a meu Deus!"]}]},{"n":446,"x":false,"t":"PRECIOSA FÉ","r":"LDM Miguel A. Huerto · SANTA CENA · Hch.1:11 ESPERANÇA","b":[{"k":"v","l":["Preciosa fé Senhor, semeaste em minha alma","Qual formosa flor teu amor regou,","Tua fé acendeu uma luz como uma chama","Mudando meu viver e o coração."]},{"k":"c","l":["Nesta fé quero viver,","Quero morrer e terminar;","Nesta fé te vi partir ao céu","E nesta mesma fé, por mim virás."]},{"k":"v","l":["A paz que sinto hoje é só um brilho","Que vejo ao contemplar tua Santa face,","Não é nem a metade da tua formosura,","Que eu desfrutarei contigo lá."]},{"k":"v","l":["A doce comunhão que inspira a alma","Tão só é resplendor de seu calor,","Não tem comparação, a tua formosura","o que será viver contigo lá?"]},{"k":"v","l":["E quando chegue o pão, virei a dizer-te:","Aqui estou Senhor, por teu perdão,","Quando o vinho estiver, poderei cantar-te:","Sou teu meu Senhor, vem logo, já."]}]},{"n":456,"x":false,"t":"QUE BOM É O MESTRE","r":"Lc.10:33 GRAÇA · Lc. 8:24 GOZO","b":[{"k":"v","l":["Que bom é o meu mestre,","Como poderei pagar?","Quando me viu navegando,","No mundo da maldade,","Me estendeu sua Santa mão;","Ele quis me resgatar."]},{"k":"c","l":["Mestre, oh, mestre, mestre da Galileia,","Tu me viste naufragando como o barco na maré;","Mestre, ó mestre, mestre de Nazaré,","Não te esqueças dos teus, não os deixes perecer."]},{"k":"v","l":["Que bom é Jesus Cristo,","Nunca me esquecerei,","Quando eu o ofendi,","Não viu minha iniquidade.","Se mostrou bem fiel comigo,","Perdoando minha maldade."]},{"k":"v","l":["Minha vida já era perdida,","O inimigo me feriu;","Mais o bom samaritano,","Caminhando me encontrou.","Me estendeu a sua Santa mão, minhas feridas cobriu."]},{"k":"v","l":["Só te peço meu mestre,","Que aumenta a minha fé,","Para seguir avançando,","E animando a quem não crê.","Por que o tempo se aproxima,","Temos que pregar a fé."]}]},{"n":459,"x":false,"t":"QUE DOCE É TEU NOME…!","r":"Sal. 138:2 DIVINIDAD · Ef. 2:5 GRAÇA","b":[{"k":"v","l":["Que doce é teu nome, ó Jesus!","Calma tens posto em meu coração;","Tua morte na cruz, me trouxe salvação,","Por fé vou caminhando em tua luz,","Minhas tristezas jogaste na profundidade,","jamais delas as de lembrar;","Tua sangue me limpou de toda iniquidade,","E estabeleceu em mim tua verdade."]},{"k":"v","l":["Que doce é teu nome, ó Jesus!","Tiveste da minha alma compaixão;","enches-te de saúde, todo meu coração,","Por tua misericórdia e virtude.","Um cântico de graças, sinto em meu ser,","Tua senda para mim é um prazer;","Meus olhos fitos para o céu podem ver,","A glória de teu grande poder."]},{"k":"v","l":["Que doce é teu nome, ó Jesus!","Eterno será o gozo em tua mansão;","Moradas de júbilo e plana luz,","Lá não terá mais tribulação.","Por tua misericórdia, faz-me conhecer","Tua vontade para florescer;","Conforme a tua promessa sei que voltarás,","Portanto, não me deixes cair."]}]},{"n":461,"x":false,"t":"QUE GOZO TENHO","r":"1 Jn.4:13 GOZO · Rom. 6:4 BATISMO","b":[{"k":"v","l":["Que gozo tenho por que sou salvo,","O sinto em meu coração;","Era estrangeiro, Cristo me trouxe,","A fazer parte de sua missão."]},{"k":"c","l":["Foi até mim e me salvou,","E com seu sangue minhas culpas apagou;","Que amor tão grande, Jesus me deu,","E com seu espírito me batizou."]},{"k":"v","l":["Longe estive, em mal sendeiro,","Em meus pecados e sem temor;","Vivi sem gozo que agora sinto,","Só esperava condenação."]},{"k":"v","l":["Preciosas novas que escutei,","Do mensageiro que Deus mandou;","Falou de Cristo e sua palavra,","Queria dar-me a salvação."]},{"k":"v","l":["Agora sou livre, Jesus me fez,","Quando minha culpas perdoou;","Vivo seguro, não tenho medo,","Está promessa Ele me deu."]}]},{"n":465,"x":false,"t":"QUE MINHA VIDA INTEIRA ESTEJA","r":"Col. 3:3 CONSAGRAÇÃO · 2 Cor. 7:1 INTERSEÇÃO","b":[{"k":"v","l":["Que minha vida inteira esteja, consagrada a Ti, Senhor;","Que minhas mãos guiadas sejam, pôr o impulso de teu","amor."]},{"k":"c","l":["Lava-me em teu sangue salvador;","Limpa-me de toda minha maldade;","Trago a ti minha vida para ser Senhor,","Tua pela eternidade."]},{"k":"v","l":["Que meus pés, tão só em pós, do santo possam ir;","E que a Ti Senhor minha voz, se alegre abençoar."]},{"k":"v","l":["Que meu tempo todo esteja, consagrado a teu louvor;","Que meu lábios ao falar, falem só do teu amor."]},{"k":"v","l":["Toma, ó Deus, minha vontade, fazê-la tua nada mais;","Toma tudo o que sou, por teu trono o terás."]},{"k":"v","l":["Toma, tu meu amor que hoje, a teus pés venho a pôr;","Toma tudo o que sou, todo teu quero ser"]}]},{"n":466,"x":false,"t":"QUE SERIA DE MIM","r":"","b":[{"k":"v","l":["Que seria de mim sem tua presença","Vagaria pelo mundo sem achar","Essa luz que ilumina meu caminho","Essa luz que me diz que aqui estas."]},{"k":"c","l":["Sou feliz ao sentir que estás comigo","Como o ar que se sente e não se vê","Tu conheces meus mais profundos sentimentos,","graças Cristo por me preencher do teu amor."]},{"k":"v","l":["Há um sol ao despontar cada manhã,","E mil aves que entoam seu cantar, te dou graças","Por me deixar ser teu filho e te peço","Me acompanhes no meu andar."]},{"k":"v","l":["Graças Pai por me trazer a teu povo","Onde está um apóstolo de Deus,","Sou feliz ao sentir em mim tua obra","Receber o ungido do senhor."]}]},{"n":472,"x":false,"t":"QUEM SERÁ MEU FIADOR?","r":"2 Co.5:10 GRAÇA · Luc. 13:8 INTERCESSÃO","b":[{"k":"v","l":["Quem será meu fiador? Perguntei-me ao deixar,","Para sempre a senda errada do mal;","Quando o juiz sem igual perante mim contemplei,","A quem, por justiça, por fim eu terei?"]},{"k":"c","l":["Quando o Juiz sem igual veio a minha alma a julgar,","E um fiador me pediram pra minha alma imortal;","Ali meu Jesus se tornou a meu favor,","E exclamou com amor: eu respondo por ti."]},{"k":"v","l":["Quão escuro o passado que na cruz contemplei,","Quanto erro e pecado na senda que andei;","Pois ali bem não tem que seja a meu favor,","Ó, quem, pois, por minha alma, vai quer responder?"]},{"k":"v","l":["A justiça eu vi sua balança mostrar,","E tremi e gemi a balança ao pisar;","Me pesei e ali bem carente me achei,","Ó, quem, pois, por minha alma, vai quer responder?"]}]},{"n":478,"x":false,"t":"QUERO SEGUIR AS PISADAS DO MESTRE","r":"1 P.2:21 Obreiros · MT. 11:29 GOZO","b":[{"k":"v","l":["Quero seguir as pisadas do Mestre,","Quero ir em pós do meu Rei e Senhor;","E modelando por Ele meu carácter,","Canto com gozo a meu Redentor."]},{"k":"c","l":["Que belo é seguir as pisadas do Mestre!","Sempre na cruz, perto de Jesus;","Que belo é seguir as pisadas do Mestre!","Em sua Santa luz."]},{"k":"v","l":["Ando mais perto dEle que me guia,","Quando o maligno me queira tentar;","Sempre confiando em Cristo, meu forte,","Devo com gozo, seu nome louvar."]},{"k":"v","l":["Sigo seus passos, de meigo carinho,","Misericórdia, amor e lealdade;","Vendo a Ele, pelo dom da graça,","Vou ao descanso, gloriosa cidade."]},{"k":"v","l":["Quero seguir as pisadas do Mestre,","Sempre até o céu, com Ele quero andar;","Vendo a meu Rei em gloriosa formosura,","Com Ele em glória, poderei descansar."]}]},{"n":480,"x":false,"t":"QUERO SER","r":"LDM Efraim Lopez A · CONSAGRAÇÃO · JN 1:3 Súplica","b":[{"k":"v","l":["Quero ser, o Senhor, meu Deus, para Ti,","O grato perfume que exalam as flores,","Quero ser, o Cristo amoroso, em meu cantar,","O cantar formoso que oferecem as aves.","Quero ser em tua presença, divino Jesus,","A mais doce e terna melodia para Ti","// Quero ser, eu quero ser//"]},{"k":"c","l":["A alegria, a doce alegria,","O belo sorriso do Ungido Santo,","Ó, meu Cristo, não quero ser carga,","Também não tristeza a quem me ama tanto.","Meu amado, imitar-te quero","Dai-me da tua ajuda para consegui-lo,","Não me deixes quero ser ajuda e não ser tropeço,","Quero ser-te útil."]},{"k":"v","l":["Quero ser agradável e limpo para Ti,","Buscarei em minha alma o mais bom e puro","Para ti que me deste // muito// amor,","Que me deste vida sem que eu mereça.","Oh Senhor somente te peço que escutes minha voz,","Porque eu te devo // tudo // o que sou,","//Eu tão só quero ser//"]}]},{"n":482,"x":false,"t":"QUERO SER-TE FIEL SENHOR","r":"AP. 22:5 INTERCESSÃO · Dan. 12:2 VENCIMENTO","b":[{"k":"v","l":["Quero ser-te fiel Senhor, perseverando até o fim,","Eu desejo ouvir sua voz e desejo ouvir teu chamar;","Leva-me a viver em Sião, onde tem vida sem fim,","Cidade que não tem sol, nem lua brilhará ali."]},{"k":"c","l":["Senhor quando Tu venhas com grande poder,","Lembra-te de mim, não me deixes aqui;","Se na tumba me encontro sem poder falar","Teu anjo santo me acorde ali."]},{"k":"v","l":["Leva-me ao céu Senhor, onde teus santos vão,","Dá-me tua proteção, para que eu vença o mal;","Porque em tua casa Senhor, muitas moradas estão,","A quem seu próximo amou, por sua porta entrará."]},{"k":"v","l":["Também te peço Senhor, o dom da caridade,","Quem seu próximo amou, sua lei cumpriu já;","Mas quem não tem amor, sua alma perdida estará,","E na casa do meu Deus, a entrada não terá."]},{"k":"v","l":["Deus do céu e da terra, neste canto eu te peço,","Tem de mim misericórdia, não me tires do teu livro;","Quando teu filho amado venha a levar os redimidos,","Me chamem a tua direita, o lugar dos benditos."]}]},{"n":487,"x":false,"t":"RESSUCITOU, ANUNCIO DAI","r":"LC. 24:5 PAIXÃO · 1 Cor. 15:4 MEDITAÇÃO","b":[{"k":"v","l":["Ressuscitou, Anúncio daí,","Ao mundo que sua morte viu;","Tomou na cruz nosso lugar,","Mas do sepulcro reviveu."]},{"k":"c","l":["Porque buscai a Cristo ali?","Entre os mortos não está;","Não lê choreis, cantai e ri,","E proclamai: que Cristo vive e reina já!"]},{"k":"v","l":["Viram tristes pra sepultar,","Quantos nele tiveram fé,","Toda esperança morta já,","Pensaram sepultar com Ele."]},{"k":"v","l":["Mas o sepulcro não conseguiu,","Em suas prisões conter","Ao Cristo Rei, que vencedor,","Foi da morte e seu poder."]},{"k":"v","l":["Ressuscitou, já não terá","Sombras para a tumba do fiel;","Porem morrendo viverá,","Quem acreditar só nEle."]}]},{"n":488,"x":false,"t":"REI DOS CÉUS","r":"2Co.5:6 CONSAGRAÇÃO · At.2:46 COMUNHÃO","b":[{"k":"v","l":["Rei do céus abençoa teu povo,","Todos unidos em um santo amor,","Todos contentes louvam teu nome,","Rei dos céus, bendito Senhor."]},{"k":"c","l":["Aqui somos peregrinos, vamos ausentes de Ti,","Mas esperamos tua graça","De estar no teu reino, bem perto de ti."]},{"k":"v","l":["Este rebanho que tens escolhido","Do perdido, do mundo sem luz,","Hoje tem vida por teu santo nome","Rei dos céus, glorioso Jesus."]},{"k":"v","l":["As vestiduras que tu preparaste,","Que resplandecem brilhantes de luz,","Lá em teu reino serão distribuídas,","Também tiaras, glorioso Jesus."]},{"k":"v","l":["Este conjunto de povos unidos","Pôr o espírito santo de Deus,","Em tua presença se verão reunidos","Glorificando teu nome , ó Senhor"]}]},{"n":497,"x":false,"t":"SEGURO SE ENCONTRA","r":"Jn. 10.16 BATISMO · Jn. 10:14 CONFIANÇA","b":[{"k":"v","l":["Seguro se encontra o aprisco,","O rebanho tranquilo está;","Mais longe sem rumo no risco,","Em meio ao mal uma vai.","Ao risco a neblina o inunda,","A errante já chega a casa;","Mas o bom pastor a cuida,","E em seus braços a leva ao redil."]},{"k":"c","l":["Em rude tempestade chama,","De sangue a senda Ele regou;","Louvai a Jesus por acha-la","Pois a ovelha perdida fui eu."]},{"k":"v","l":["Pavor a mato lhe provoca,","Os cardos lhe ferem os pés;","Mas segue sereno em sua busca,","Desafiando a morte assim","Jesus ansiedade monstra,","Em sua ovelha ao pensar;","Mas vence por fim em sua luta,","E seguro a leva ao lar."]},{"k":"v","l":["O pródigo salvo se alegra,","Nos braço do seu redentor,","E cheio de jubilo exclama,","O vê quão feliz eu sou!","A noite terrível passou,","O sol se vê já brilhar;","Sua ovelha Ele resgatou,","E de novo a leva ao lar."]}]},{"n":501,"x":false,"t":"SENHOR AQUI A TEUS PÉS","r":"Lc. 7:38 GRATIDÃO · Heb. 4.16 GRAÇA","b":[{"k":"v","l":["Senhor aqui a teus pés, choro de gratidão,","Porque todas minhas faltas, tens perdoado Tu, sinto uma","coisa estranha, no meu coração, arde como uma chama, e","teu divino amor."]},{"k":"c","l":["Como poderei expressar, minha gratidão Senhor?","Eu só posso chorar com lágrimas de amor;","Nada te posso dar, só meu coração,","Quero estar perto, mais perto de Ti, Senhor."]},{"k":"v","l":["Quão doce é chorar, ao sentir o perdão,","Sabendo que em verdade, tua graça me alcançou;","Quem me poderá separar? Se em teu caminho vou,","Me guardaras do mal, por que Teu eu sou."]},{"k":"v","l":["Ó que felicidade, sinto em todo meu ser,","Ao vir para chorar, Senhor a teus pés;","Glória e eternidade, é tua promessa fiel,","Onde tu sempre estás, permite que esteja eu."]}]},{"n":502,"x":false,"t":"SENHOR JESUS QUÃO BELA","r":"Sal.122:1 GOZO · Hch. 2:46 EXORTAÇÃO","b":[{"k":"v","l":["Senhor Jesus quão bela, a igreja onde tu estas,","Suspira já por ela, minha alma sem parar."]},{"k":"c","l":["Vem, o vem, a seu templo,","O, vem ao lar do Senhor;","Me alegrei ao ouvir que diziam, vem,","Para a casa do senhor prosseguir."]},{"k":"v","l":["Minha alma ansiosa, tua igreja quer ver,","E quero Cristo amante, a ti pertencer."]},{"k":"v","l":["Melhor estar um dia, contigo em santidade,","Que mil em alegria , em sendas de maldade."]},{"k":"v","l":["Benditos os que vem, ao templo do Senhor,","Pois em sua graça tem, o gozo e o vigor."]},{"k":"v","l":["Prefiro eu as portas, do templo celestial,","Que sendas tão incertas, de mundanidade."]}]},{"n":503,"x":false,"t":"SENHOR, MEU DEUS","r":"Sal.3:3 AMANHECER · AP. 19:6 LOUVORES","b":[{"k":"v","l":["Senhor , meu Deus ao contemplar os céus,","O firmamento e as estrelas mil,","Ao ouvir sua voz nos fortes trovões;","E ver brilhar ao sol em seu resplendor."]},{"k":"c","l":["Elevo Minh´ alma ao Salvador meu Deus,","// Grandioso és Tu//","Meu coração entoa esta canção,","// Grandioso és Tu//"]},{"k":"v","l":["Ao percorrer, os montes é os vales,","E ver as belas flores ao passar;","Ao escutar o canto das aves,","E o murmurar do claro manancial."]},{"k":"v","l":["Quando relembro do amor Divino,","Que desde os céus, o Salvador enviou;","Aquele Jesus que por salvar-me veio,","E em uma cruz sofreu, por mim morreu."]},{"k":"v","l":["Quando o Senhor me chame a sua presença,","Ao doce lar, ao céu de esplendor;","O adorarei cantando a grandeza,","Do seu poder e infinito amor."]}]},{"n":505,"x":false,"t":"SENHOR, TU VÊS MEU CORAÇÃO","r":"Sal. 139:23 SALMOS · Sal. 26:2 AVIVAMENTO","b":[{"k":"v","l":["Senhor tu vês meu coração, minha forma de pensar,","E toda minha meditação, a podes tu pesar."]},{"k":"c","l":["Explora tu meu coração, meus pensamentos vê,","E olha se há uma impiedade em mim","E guia-me na vida eterna."]},{"k":"v","l":["Meus pensamentos e falar, conheces Tu Senhor,","Onde quer que posso estar, recebo teu favor."]},{"k":"v","l":["Se em assas de aurora vou, do mundo mais além,","Eu sei que em tua presença estou, ali tua mão está."]},{"k":"v","l":["De ti não posso-me esconder, Tu vai na frente de mim,","São luz e sombras ao par, iguais para Ti."]},{"k":"v","l":["Sê tu Senhor, meu justo juiz, contigo quero ir,","Contigo estar, meu anseio é, de ti jamais partir."]}]},{"n":511,"x":false,"t":"SE CRUZAS ESTE VALE","r":"Sal. 23:4 CONSAGRAÇÃO · Is. 40:30 CONFIANÇA","b":[{"k":"v","l":["Se cruzas este vale tenebroso,","Sem luz em teu caminho, fatigado;","Se ninguém a teu clamor a respondido,","Não temas, que o Senhor vai a teu lado."]},{"k":"c","l":["Traz ao Senhor cuidados e quebrantos,","E vem a Ele com toda tua impureza;","Limpo te fará e em sua bondade imensa,","Cobrir-te a de graça e amor santo."]},{"k":"v","l":["Jesus é viva fonte de consolo,","Que calma os pesares da vida;","Ele trouxe, como pomba dos céus,","O bálsamo de paz pra alma ferida."]},{"k":"v","l":["Escuta o amoroso chamamento","De Cristo, inocentíssimo cordeiro;","Ele veio a resgatar-te com seu sangue,","Morrendo escarnecido, num madeiro."]}]},{"n":518,"x":false,"t":"SE FUI MOTIVO DE DOR","r":"Luc.18:13 PERDÃO · Sal.55:1 SÚPLICA","b":[{"k":"v","l":["Se fui motivo de dor, o Cristo,","Se por minha causa o frágil tropeçou,","Se em tuas pisadas caminhar não quis;","Perdão te peço meu Senhor e Deus."]},{"k":"c","l":["Escuta o Deus minha confissão humilde,","E livra-me de tentação sutil,","Preserva sempre Minh ‘alma em teu rebanho","Perdão de peço meu Senhor e Deus."]},{"k":"v","l":["Se vã e torpe minha palavra tem sido,","Se ao quem sofreu em sua dor deixei;","Não me condene tu, por meu pecado,","Perdão te peço meu Senhor e Deus."]},{"k":"v","l":["Se tu me ajudas o Deus, no caminho,","A compreender melhor tua vontade;","Concede-me Senhor, mais da tua graça,","E dá-me o Deus, mais de teu amor."]}]},{"n":519,"x":false,"t":"SIGO A CRISTO","r":"Jn. 8:12 LOUVORES · Ef. 5:8 GOZO","b":[{"k":"v","l":["Sigo a Cristo,","Ele é meu caminho,","O sigo por terra , os vales e o mar;","Jesus promete,","Ele nunca deixar-me,","Promessa divina, que não faltará."]},{"k":"c","l":["// Cristo é a luz//","Luz que inunda todo meu ser;","Aleluia, me regozijo,","Cantando glórias, ao meu Jesus."]},{"k":"v","l":["As nuvens que vem, ou nuvens vem vão,","Nunca meu guia, poderão encobrir;","Ele é pura luz, sem sombra alguma,","Sempre a seu lado, eu vou seguir."]},{"k":"v","l":["Sempre na luz, eu me regozijo,","Sigo adiante, vou a meu lar;","Vou caminhando, com gozo cantando,","Ando na luz, que sempre amarei"]}]},{"n":525,"x":false,"t":"SEMENTE SANTA EU SOU","r":"LDM Francisco Andrade · CRIANÇAS","b":[{"k":"v","l":["Semente santa eu sou do povo do Senhor","Aqui me tocou nascer, glória seja a meu Senhor","Não conheci a maldade nem também o erro","Minha alma sempre contente hoje abençoa seu Criador."]},{"k":"c","l":["Que amor tão grande Cristo mostrou para mim","Trazer a meus pais a seu bendito redil,","Minha juventude seja sua, sempre seja dEle,","Não tenho com que pagar a Jesus Cristo meu Rei."]},{"k":"v","l":["Meu pais na maldade viveram um dia sem Deus","Viveram no erro sem saber da verdade","Meu Cristo mostrou seu amor e do mundo os tirou","Hoje se encontram contentes na igreja do Senhor."]},{"k":"v","l":["Me dizem que o Deus de Abraão um grande apóstolo","enviou","Que na terra pregou a palavra do Senhor,","Meu pais dizem também que por Ele estão aqui","Que por Ele tiveram vida e o lembram com amor."]}]},{"n":527,"x":false,"t":"SE ESCURA FOI MINHA VIDA","r":"LDM TULIO GÓMEZ · 1 Jn. 2:8 RESTAURAÇÃO · 1 JN.5:4 CONFIANÇA","b":[{"k":"v","l":["Se escura foi minha vida e errado meu caminho,","Qual noite tenebrosa que faz estremecer;","Tu em nela já me diste, Jesus, teu amor divino,","E vivo abaixo do céu de um claro amanhecer."]},{"k":"c","l":["Igreja do Deus vivo e farol luminoso,","Coluna e apoio de toda a verdade;","Tua espada é a palavra que vence o inimigo,","E o homem temeroso encontra liberdade."]},{"k":"v","l":["Hoje tenho a esperança de ganhar vitória,","E sonho com triunfo completo de Jesus;","E olho neste mundo brilhar novas auroras,","E povos que se rendem ao nome de Jesus."]},{"k":"v","l":["Que importa as ciladas e poder do inimigo!","As armas que utilize o príncipe de erro;","Não temo a batalha, se tu vens comigo,","Pois sei que com teu braço, serei eu vencedor."]}]},{"n":531,"x":false,"t":"SE TE PERGUNTAM: PRA ONDE VAIS?","r":"LDM Francisco Andrade · MT 4:2 SANTA CEIA","b":[{"k":"v","l":["Se te perguntam: pra onde vais?","Dize lhes, pra cidade de Deus;","Nunca escutei, disso não sei,","// É um povo chamado// o novo Israel."]},{"k":"c","l":["Cidade bendita, onde mora meu Deus,","Minh´ alma, desejava voltar lhe a ver;","Passaram muitos dias e o tempo transcorreu,","O, que alegria, voltar a ver o rosto;","Do príncipe de Deus."]},{"k":"v","l":["Formoso templo se edificou,","Desejo grandioso do irmão Arão;","Ele não o viu, Ele já se foi,","// Mas o edificou// o irmão Samuel."]},{"k":"v","l":["Se estas triste, confia em Deus,","Tem fé e confiança, não dúvidas dEle;","Que milhares de almas acham perdão,","// E fiéis regressam// a servir a Deus."]},{"k":"v","l":["Cidade formosa, cheia de luz,","Qual como tu, outra não há;","De ti brotam, como manancial, palavras de vida,","Porque em ti se encontra o apóstolo de Deus."]}]},{"n":546,"x":false,"t":"SOU UM SOLDADO","r":"","b":[{"k":"v","l":["Sou um soldado de Jesus","e servo do Senhor;","Não temerei levar a cruz","sofrendo grande dor."]},{"k":"c","l":["Depois da batalha me coroará,","//Deus me coroará; //","Depois da batalha me coroará,","na celestial mansão,","Lá verei o meu Rei e terei meu galardão,","Depois da batalha me coroará,","na cidade de Sião."]},{"k":"v","l":["Lutaram outros sem temor,","Mui forte hei de ser;","Pelejarei por meu senhor,","Confiando em seu poder."]},{"k":"v","l":["Se eu for fiel ao meu Jesus,","e não voltar pra trás,","alcançarei no céu de luz,","lugar de Santa paz"]}]},{"n":1,"x":true,"t":"CONTIGO ESTOU TÃO FELIZ","r":"","b":[{"k":"v","l":["Graças a Deus que me dá a vida,","Graças a Deus que me dá a paz","Seu braço forte sempre me segura","E seu grande amor sempre me dará"]},{"k":"c","l":["Contigo estou tão feliz, ó Senhor meu Jesus!","Que me deste a vida, me deste amor, me deste a paz,","Contigo estou tão feliz ó Apóstolo de Deus,","A te dou minhas forças para o serviço do Senhor."]},{"k":"v","l":["E quando eu venho a tua santa igreja,","Minh’ alma sente algo inexplicável,","É a tua presença o meigo Jesus,","Que me deu vida o gozo e a paz."]},{"k":"v","l":["Somos um povo cheio de alegria,","Somos um povo de grande bênção,","E Deus enviou seu grande Apóstolo,","Para nos dar luz e grande bênção."]}]},{"n":2,"x":true,"t":"A OBRA PERFEITA","r":"","b":[{"k":"v","l":["Há uma chama acesa em Minh 'alma,","Chama ardente no coração,","Luz que refulge que brilha e se aviva,","Quando está perto o Apóstolo de Deus."]},{"k":"c","l":["Esta é a obra perfeita na vida:","Crer ao homem enviado por meu Deus,","É uma chama acesa em Minh’ alma","Pelo Espírito Santo do Senhor,","Por esta obra perfeita em minha vida","Que por sua graça o senhor me concedeu,","Minh’ alma inteira esta agradecida,","Bendito seja meu Rei e salvador."]},{"k":"v","l":["Quando me disseram que apóstolo de Cristo é necessário","Para salvação, eu não sabia, meu coração ardia","Não era outra coisa que a graça do senhor."]},{"k":"v","l":["Quando o batismo tomei na Igreja,","Me perguntaram Tu crês na Eleição?","Como me esquecer daquele dia formoso,","Eu disse Amém e o perdão meu Deus me deu."]},{"k":"v","l":["Bendita graça achei no meu Cristo,","Porque ele a ver minh’ alma se dignou.","Como poderei agradecer tal presente,","Sempre serei Servo fiel"]}]},{"n":3,"x":true,"t":"A IGREJA DO DEUS VIVO","r":"","b":[{"k":"v","l":["A Igreja do Deus Vivo marcha, marcha,","A Igreja do Deus Vivo marcha ao reino celestial.","Naasón Joaquin Apóstolo é o guia,","Naasón Joaquín Apóstolo com Cristo nos levará."]},{"k":"c","l":["Glória nas alturas, os cristãos cantam docemente,","Glória nas alturas a nosso Salvador."]},{"k":"v","l":["Somos A Luz do Mundo, Luz do Mundo,","Somos A Luz do Mundo pela graça do Senhor,","Nós somos vencedores, vencedores;","Nós somos vencedores com Naasón Servo de Deus."]},{"k":"v","l":["Felizes vozes se ouvem, vozes se ouvem,","Felizes vozes se ouvem ressoando com fervor,","A Cristo damos glória, damos glória,","Marchando com seu Apóstolo ao encontro celestial."]},{"k":"v","l":["Temos um Apóstolo e um mestre,","Naasón Joaquín se chama nosso guia espiritual,","Nos levará a Cristo, sim a Cristo,","Nos levará a Cristo e ao Pai Celestial."]}]},{"n":4,"x":true,"t":"Ó CRIADOR","r":"","b":[{"k":"v","l":["Ó Criador Deus do céu eterno,","Que fizeste o mar e o universo,","Tu que és o Senhor dos céus","E não há outro a quem adorar."]},{"k":"c","l":["Nossas almas te dão aleluias,","Por que Tu és meu Rei e Senhor,","E eu quero por sempre te louvar,","Por que Tu és meu Pai Eternal."]},{"k":"v","l":["Em ti se reconhecem tuas obras,","Vejo a lua, o mar e a terra;","E o homem que fizeste do pó,","E a vida que deste a Ele."]},{"k":"v","l":["Tudo o que formaste Senhor,","O fizeste com um só fim;","Que tuas obras a ti louvassem,","Para sempre pela eternidade."]},{"k":"v","l":["Oh Jeová quão gloriosas tuas obras,","Que meu ser admirado está;","E que sempre Minh’ alma te louve,","por que Tu és meu Rei e Criador."]}]},{"n":5,"x":true,"t":"EU ADORO UM DEUS","r":"","b":[{"k":"v","l":["Eu adoro a um Deus Onipotente","Eu adoro a um Deus que dá a vida,","O Deus de amor que vive e reina,","Jeová meu Deus que dá consolo ao meu existir."]},{"k":"c","l":["O Deus de Abrão, Deus de Aarão","Deus de Samuel e Naasón Joaquin","O Deus de glória que fez os céus","Que dá a chuva sublime gozo que é caridade."]},{"k":"v","l":["Eu tenho um sol, que alumia o mundo,","Um sol que nunca se apagará, um sol que acende os","corações","//a luz divina// que nos guiará"]},{"k":"v","l":["Eu adoro a Cristo que dá a vida,","Ao Deus de glória que nos dá paz,","Nos deu uma herança tão pura e santa","//não há nenhuma// não há outra igual"]},{"k":"v","l":["Estou contente nesta igreja,","Porque há Apóstolo do Senhor","O qual honramos com alegria","//porque é enviado // de nosso Deus"]}]},{"n":6,"x":true,"t":"FAZENDO HISTORIA","r":"","b":[{"k":"v","l":["Somos o Povo Escolhido a Igreja de Cristo que grande benção,","Uma igreja imponente um povo valente, içando o pendão,","Edificado sobre o fundamento de apóstolos do Senhor,","Sendo o primeiro Jesus Cristo, mesmo o Redentor a pedra angular."]},{"k":"c","l":["Juntos fazendo história com o Apóstolo de Deus,","Adiante marcha a igreja de Deus,","Juntos fazendo história escrita no livro de Deus,","Esta igreja vive sempre feliz,","Fazendo história com seu apóstolo Naasón Joaquín"]},{"k":"v","l":["Esta igreja tomou uma força que o mundo não pode","entender, Jovens crianças e anciãos; os corais pregando","em todo lugar, Em rancharias, em grandes cidades a","Igreja vai resplandecer Porque é tempo de prosperidade,","amor e liberdade, de grande bênção"]},{"k":"v","l":["Juntos fazendo história, levando ao mundo palavra de","amor, Como a luz da aurora que vai aumentando até a","perfeição, Ninguém detém esta Igreja porque conosco há","servo de Deus, É A Luz do Mundo tão brilhante mais que","o mesmo sol, Caminha sem temor.","(REFRÃO FINAL)","Juntos fazendo história com o apóstolo de Deus,","Adiante marcha a Igreja de Deus.","Juntos fazendo história escrita no livro de Deus,","Esta IgrejaHinário","viveA Luz Dosempre","Mundo feliz,","Fazendo história Vamos a triunfar."]}]},{"n":7,"x":true,"t":"NOSSO CAPITÃO ESTA CHAMANDO","r":"","b":[{"k":"v","l":["Nosso capitão está chamando,","A lutar chamando esta,","Fies sem temor vamos marchando,","A Vitória ele dará."]},{"k":"c","l":["Ouvir, ouvir, nos chama a trombeta,","Para lutar chamando está,","Saí, saí o diabo desafia quem contra ele lutará.","(Ouvir, ouvir, nos chama a trombeta a vencer","chamando esta é nosso chefe Cristo","e sua virtude inteira a Vitória nos dará)"]},{"k":"v","l":["Vamos companheiros hasteando A bandeira da cruz,","Vamos com valor está chamando nosso capitão Jesus"]},{"k":"v","l":["O soldado fiel paz, terá um dia e suas armas deixará,","Cristo lhe dará as boas-vindas e a coroa lhe dará."]}]},{"n":8,"x":true,"t":"HONORÁVEL","r":"","b":[{"k":"v","l":["Ninguém me pode separar do amor,","Que Cristo tem gerado em mim, provas, Tribulações, nem","as muitas águas, Podem jamais apagar a perfeita obra","Que meu senhor fez em meu ser por sua eleição creio","Em ti."]},{"k":"c","l":["É teu apostolo de Deus, em tudo minha inspiração,","De integridade, honorável em todo teu ser,","Tuas obras falam de ti, falam do amor,","Honorável perante de Deus,","Milhões erguem sua voz oh meu Pai Naasón"]},{"k":"v","l":["A Eleição de Deus hoje está em teu ser.","E aonde quer que fores,","eu vou firme a teu lado,","Com meu braço em alto,","porque teu povo é também meu povo,","teu Deus meu Deus é,","te seguirei por sempre te amarei de coração."]},{"k":"v","l":["Pelo qual estou mui Seguro e sei, nem anjos,","Nem os principados, nem as potestades podem me","afastar, Nem o presente, nem o que A Mim chegue,","Poderão apagar a luz de fé que hoje vive em mim por tua","Eleição."]},{"k":"v","l":["Me instruiu muito bem, seu exemplo segui,","Agora na batalha forte,","Não tenha pendentes ó meu pai valente,","Conquistaremos o mundo inteiro com","Teu evangelho fiel de salvação,","Que Cristo te entregou com seu amor."]}]}]</script>
<script>
/* ---------- datos ---------- */
const RAW = JSON.parse(document.getElementById("hinos-data").textContent);
// orden: numerados y luego adicionales
const HINOS = RAW.map((h,i)=>({ i, n:h.n, x:h.x, lbl:(h.x?"A"+h.n:String(h.n)), t:h.t, r:h.r, b:h.b }));

const store = {
  get(k,d){ try{ const v = localStorage.getItem("hin2_"+k); return v? JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem("hin2_"+k, JSON.stringify(v)) }catch(e){} }
};
let favs = new Set(store.get("favs",[])), recs = store.get("recs",[]), fs = store.get("fs",18.5), tab="num", cur=null, busy=false;
const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const key = h => norm(h.t.replace(/^[¡¿(“"'\s]+/,""));
const first = h => (key(h).match(/[a-z]/)||["#"])[0].toUpperCase();
const flameSvg = cls => '<svg class="flame '+(cls||"")+'"><use href="#flame"/></svg>';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name="theme-color"]').content = t==="dark" ? "#121726" : "#ffffff";
}
applyTheme(store.get("theme","light"));
document.documentElement.style.setProperty("--fs", fs+"px");
$("cnt").textContent = HINOS.length;

const starSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg>';
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(text,q){
  if(!q) return esc(text);
  const n = norm(text), i = n.indexOf(q);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
const allLines = h => h.b.flatMap(b=>b.l);

/* ---------- lista ---------- */
let io;
function render(){
  const raw = $("q").value.trim(), q = norm(raw);
  $("clear").classList.toggle("on", !!raw);
  let items = HINOS, lyricHit = {};
  if(tab==="fav") items = HINOS.filter(h=>favs.has(h.i));
  if(tab==="rec") items = recs.map(i=>HINOS[i]).filter(Boolean);
  if(q){
    items = items.filter(h=>{
      if(norm(h.lbl).startsWith(q) || norm(h.t).includes(q)) return true;
      const line = allLines(h).find(l=>norm(l).includes(q));
      if(line){ lyricHit[h.i]=line; return true } return false;
    });
    items.sort((a,b)=>(a.i in lyricHit)-(b.i in lyricHit) || a.i-b.i);
  }
  if(tab==="az" && !q) items = [...items].sort((a,b)=>key(a).localeCompare(key(b)));
  const groups = tab==="az" && !q;
  const list = $("list"); let html="", last="";
  if(!items.length){
    const msg = tab==="fav"&&!q ? "Toque na ⭐ de um hino para salvá-lo aqui." : tab==="rec"&&!q ? "Os hinos que você abrir aparecerão aqui." : "Nenhum hino encontrado para “"+esc(raw)+"”.";
    list.innerHTML = '<div class="empty">'+flameSvg()+'<p>'+msg+'</p></div>';
  } else {
    for(const h of items){
      if(groups){ const L = first(h); if(L!==last){ html += '<div class="sec" id="L-'+L+'"><b>'+L+'</b></div>'; last=L } }
      const lh = lyricHit[h.i], li = lh ? Math.max(0, norm(lh).indexOf(q)-12) : 0;
      const sub = lh ? "“"+(li?"…":"")+hl(lh.slice(li),q)+"”" : esc(h.x ? "Adicional"+(h.r?" · "+h.r:"") : (h.r||allLines(h)[0]||""));
      html += '<button class="item rv" data-i="'+h.i+'"><span class="num'+(h.x?" ad":"")+'">'+h.lbl+'</span><span class="meta"><div class="t">'+hl(h.t,q)+'</div><div class="s">'+sub+'</div></span>'+
              '<span class="star'+(favs.has(h.i)?" on":"")+'" data-star="'+h.i+'">'+starSvg+'</span>'+chev+'</button>';
    }
    list.innerHTML = html;
  }
  $("rail").style.opacity = groups ? 1 : 0;
  $("rail").style.pointerEvents = groups ? "auto" : "none";
  io && io.disconnect();
  let batch = 0;
  io = new IntersectionObserver(es=>{
    batch = 0;
    es.forEach(e=>{ if(e.isIntersecting){ const el=e.target; el.style.transitionDelay = Math.min(batch++,8)*40+"ms"; el.classList.add("in"); io.unobserve(el);
      setTimeout(()=>el.style.transitionDelay="",700) } });
  },{rootMargin:"0px 0px -20px 0px"});
  list.querySelectorAll(".item").forEach(el=>io.observe(el));
}

$("list").addEventListener("click",e=>{
  const st = e.target.closest("[data-star]");
  if(st){ e.stopPropagation(); toggleFav(+st.dataset.star); return }
  const it = e.target.closest(".item"); if(!it) return;
  const r = it.getBoundingClientRect(), d = Math.max(r.width,r.height), sp = document.createElement("span");
  sp.className="ripple"; sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  it.appendChild(sp); setTimeout(()=>sp.remove(),600);
  setTimeout(()=>openHymn(+it.dataset.i),120);
});

function toggleFav(i){
  favs.has(i) ? favs.delete(i) : favs.add(i);
  store.set("favs",[...favs]);
  const on = favs.has(i);
  document.querySelectorAll('[data-star="'+i+'"]').forEach(s=>{ s.classList.toggle("on",on); s.classList.remove("burst"); void s.offsetWidth; s.classList.add("burst") });
  if(cur===i){ $("vStar").classList.toggle("on",on); $("vStar").classList.remove("burst"); void $("vStar").offsetWidth; $("vStar").classList.add("burst") }
  toast(on? "Adicionado aos favoritos" : "Removido dos favoritos");
  if(tab==="fav" && !on && cur===null) render();
}

function moveInd(){ const b = $("tabs").querySelector(".on"); $("ind").style.width = b.offsetWidth+"px"; $("ind").style.transform = "translateX("+(b.offsetLeft-4)+"px)" }
$("tabs").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  $("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  tab = b.dataset.t; moveInd(); render(); window.scrollTo({top:0,behavior:"smooth"});
});
$("favBtn").onclick = ()=> $("tabs").querySelector('[data-t="fav"]').click();
addEventListener("resize",moveInd);

let tmr; $("q").addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(render,120) });
$("clear").onclick = e=>{ e.preventDefault(); $("q").value=""; render(); $("q").focus() };
addEventListener("scroll",()=> $("hdr").classList.toggle("small", scrollY>20), {passive:true});

/* riel de letras */
const LETTERS = [...new Set(HINOS.map(first))].sort();
$("rail").innerHTML = LETTERS.map(l=>'<span data-l="'+l+'">'+l+'</span>').join("");
let railOn=false, railT;
function railAt(y){
  const spans=[...$("rail").children]; let hit=null;
  for(const s of spans){ const r=s.getBoundingClientRect(); if(y>=r.top-2 && y<=r.bottom+2){ hit=s; break } }
  if(!hit) return;
  spans.forEach(s=>s.classList.toggle("hot",s===hit));
  const L = hit.dataset.l, sec = $("L-"+L);
  $("bubble").textContent=L; $("bubble").classList.add("on");
  if(sec){ const top = sec.getBoundingClientRect().top + scrollY - $("hdr").offsetHeight - 4; scrollTo({top}) }
  if(navigator.vibrate) try{ navigator.vibrate(5) }catch(e){}
}
const railHide=()=>{ $("bubble").classList.remove("on"); [...$("rail").children].forEach(s=>s.classList.remove("hot")) };
const railEnd=()=>{ railOn=false; clearTimeout(railT); railT=setTimeout(railHide,250) };
$("rail").addEventListener("pointerdown",e=>{ railOn=true; try{$("rail").setPointerCapture(e.pointerId)}catch(_){} railAt(e.clientY); clearTimeout(railT); railT=setTimeout(railHide,1000) });
$("rail").addEventListener("pointermove",e=>{ if(railOn){ railAt(e.clientY); clearTimeout(railT); railT=setTimeout(railHide,1000) } });
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>$("rail").addEventListener(ev,railEnd));
["pointerup","touchend","touchcancel"].forEach(ev=>addEventListener(ev,()=>{ if(railOn||$("bubble").classList.contains("on")) railEnd() },{passive:true}));

/* ---------- vista del himno ---------- */
function hymnHTML(h){
  let html = '<div class="hk">'+(h.x?"Adicional":"Hino")+'</div><div class="hnum'+(h.x?" ad":"")+'">'+h.n+'</div><h2>'+esc(h.t)+'</h2>';
  if(h.r) html += '<div class="ref">'+esc(h.r)+'</div>';
  html += '<div class="orn">'+flameSvg()+'</div>';
  let v=0;
  for(const b of h.b){
    const body = b.l.map(esc).join("<br>");
    if(b.k==="c") html += '<div class="st coro"><span class="sn">Refrão</span><p>'+body+'</p></div>';
    else html += '<div class="st"><span class="sn">'+(++v)+'</span><p>'+body+'</p></div>';
  }
  html += '<div class="orn">'+flameSvg()+'</div><div class="foot">— '+h.lbl+' —</div>';
  return html;
}
function fill(i){
  const h = HINOS[i]; cur = i;
  recs = [i, ...recs.filter(x=>x!==i)].slice(0,30); store.set("recs",recs);
  $("hymn").innerHTML = hymnHTML(h);
  $("vt").textContent = h.lbl+". "+h.t;
  $("vStar").classList.toggle("on", favs.has(i));
  $("vscroll").scrollTop = 0; onVScroll();
}
function openHymn(i){
  if(!HINOS[i]) return;
  fill(i);
  const el = $("hymn"); el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim");
  [...el.children].forEach((c,k)=>c.style.animationDelay = Math.min(k,10)*60+"ms");
  if(!$("view").classList.contains("on")){ $("view").classList.add("on"); $("view").setAttribute("aria-hidden","false"); history.pushState({h:1},"") }
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
/* efecto de pasar la página de un libro */
function turnTo(i, dir){
  if(busy || !HINOS[i]) return;
  if(reduced.matches || !Element.prototype.animate){ fill(i); return }
  busy = true;
  const sc = $("vscroll"), r = sc.getBoundingClientRect(), view = $("view");
  const old = $("hymn").cloneNode(true); old.removeAttribute("id"); old.classList.remove("anim");
  old.querySelectorAll("*").forEach(n=>n.style.animationDelay="");
  const leaf = document.createElement("div"); leaf.className="flip";
  leaf.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;transform-origin:${dir>0?"left":"right"} center;`;
  old.style.transform = `translateY(${-sc.scrollTop}px)`;
  const shade = document.createElement("div"); shade.className="shade";
  shade.style.background = `linear-gradient(${dir>0?"90deg":"270deg"}, rgba(0,0,0,0) 30%, rgba(60,40,10,.35))`;
  leaf.append(old, shade);
  const under = document.createElement("div"); under.className="under-shade";
  under.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background:linear-gradient(${dir>0?"90deg":"270deg"}, rgba(60,40,10,.22), rgba(0,0,0,0) 45%);`;
  view.append(under, leaf);
  fill(i);                       // la página nueva queda debajo
  const dur = 720, ease = "cubic-bezier(.42,.0,.26,1)", ang = dir>0 ? -112 : 112;
